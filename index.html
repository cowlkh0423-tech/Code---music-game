<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>COLOR BEAT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #08080c;
            color: white;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            user-select: none;
        }

        button {
            font-family: inherit;
        }


        /* =================================
           전체 화면
        ================================= */

        #app {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =================================
           게임 전체
        ================================= */

        #game {
            position: relative;

            width: min(100vw, 600px);
            height: 100vh;

            max-height: 900px;

            background: #0c0c12;

            overflow: hidden;

            border-left: 1px solid #25252d;
            border-right: 1px solid #25252d;
        }


        /* =================================
           상단
        ================================= */

        #topBar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 65px;

            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(8, 8, 12, 0.95);

            border-bottom: 1px solid #292932;
        }

        #songName {
            font-size: 18px;
            font-weight: bold;
        }

        #score {
            position: absolute;

            right: 18px;

            font-size: 14px;
            color: #aaa;
        }


        /* =================================
           게임 영역
        ================================= */

        #playArea {
            position: absolute;

            top: 65px;
            bottom: 135px;

            left: 0;
            right: 0;

            overflow: hidden;
        }


        /* =================================
           레인
        ================================= */

        .lane {
            position: absolute;

            top: 0;
            bottom: 0;

            width: 33.3333%;

            border-left: 1px solid rgba(255,255,255,0.08);
        }

        #lane0 {
            left: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,40,40,0.08),
                    rgba(255,40,40,0.02)
                );
        }

        #lane1 {
            left: 33.3333%;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,220,0,0.08),
                    rgba(255,220,0,0.02)
                );
        }

        #lane2 {
            left: 66.6666%;

            background:
                linear-gradient(
                    to bottom,
                    rgba(40,120,255,0.08),
                    rgba(40,120,255,0.02)
                );
        }


        /* =================================
           노트
        ================================= */

        .note {
            position: absolute;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            transform: translateX(-50%);

            z-index: 10;

            border: 3px solid white;

            box-shadow:
                0 0 15px currentColor,
                0 0 30px currentColor;
        }

        .red {
            background: #ff3030;
            color: #ff3030;
        }

        .yellow {
            background: #ffe000;
            color: #ffe000;
        }

        .blue {
            background: #3185ff;
            color: #3185ff;
        }


        /* =================================
           판정선
        ================================= */

        #judgeLine {
            position: absolute;

            left: 0;
            right: 0;

            bottom: 35px;

            height: 4px;

            background: white;

            z-index: 15;

            box-shadow:
                0 0 10px white,
                0 0 25px rgba(255,255,255,0.6);
        }


        /* =================================
           판정 문자
        ================================= */

        #judge {
            position: absolute;

            left: 50%;
            top: 40%;

            transform: translate(-50%, -50%);

            z-index: 30;

            font-size: 32px;
            font-weight: 900;

            opacity: 0;

            pointer-events: none;
        }

        #judge.show {
            animation: judge 0.35s ease-out;
        }

        @keyframes judge {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.7);
            }

            30% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

        }


        /* =================================
           하단 버튼
        ================================= */

        #controls {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 135px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            z-index: 20;
        }

        .control {
            border: 0;

            border-top: 3px solid;

            color: white;

            background: #111118;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 7px;

            transition: 0.08s;
        }

        .control span {
            font-size: 12px;
            opacity: 0.65;
        }

        .control strong {
            font-size: 27px;
        }

        #button0 {
            border-color: #ff3030;
        }

        #button1 {
            border-color: #ffe000;
        }

        #button2 {
            border-color: #3185ff;
        }

        .control.active {
            transform: scale(0.96);
            filter: brightness(1.8);
        }

        #button0.active {
            background: rgba(255,40,40,0.3);
        }

        #button1.active {
            background: rgba(255,220,0,0.25);
        }

        #button2.active {
            background: rgba(40,120,255,0.3);
        }


        /* =================================
           시작 화면
        ================================= */

        #startScreen {
            position: absolute;

            inset: 0;

            z-index: 50;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle,
                    #20202a,
                    #08080c 70%
                );
        }

        #startScreen h1 {
            margin: 0;

            font-size: 48px;
            letter-spacing: 3px;
        }

        #startScreen p {
            color: #888;
            margin-top: 10px;
        }

        #startButton {
            margin-top: 30px;

            padding: 17px 50px;

            border: 0;
            border-radius: 12px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }


        /* =================================
           카운트다운
        ================================= */

        #countdown {
            position: absolute;

            left: 50%;
            top: 42%;

            transform: translate(-50%, -50%);

            z-index: 45;

            font-size: 75px;
            font-weight: 900;

            text-shadow:
                0 0 20px white;

            pointer-events: none;
        }


        /* =================================
           음악 플레이어
        ================================= */

        #music {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;

            pointer-events: none;
        }


        /* =================================
           모바일
        ================================= */

        @media (max-width: 600px) {

            #game {
                width: 100vw;
            }

            .note {
                width: 44px;
                height: 44px;
            }

            #startScreen h1 {
                font-size: 40px;
            }

        }

    </style>
</head>


<body>

<div id="app">

    <div id="game">


        <!-- ==========================
             상단
        =========================== -->

        <div id="topBar">

            <div id="songName">
                LEMONADE
            </div>

            <div id="score">
                HIT 0
            </div>

        </div>


        <!-- ==========================
             게임 영역
        =========================== -->

        <div id="playArea">

            <div
                class="lane"
                id="lane0">
            </div>

            <div
                class="lane"
                id="lane1">
            </div>

            <div
                class="lane"
                id="lane2">
            </div>


            <!-- 노트 -->
            <div id="notes"></div>


            <!-- 판정선 -->
            <div id="judgeLine"></div>


            <!-- 판정 -->
            <div id="judge"></div>


            <!-- 카운트다운 -->
            <div id="countdown"></div>

        </div>


        <!-- ==========================
             조작 버튼
        =========================== -->

        <div id="controls">

            <button
                class="control"
                id="button0"
                data-lane="0"
            >
                <span>RED</span>
                <strong>A</strong>
            </button>


            <button
                class="control"
                id="button1"
                data-lane="1"
            >
                <span>YELLOW</span>
                <strong>S</strong>
            </button>


            <button
                class="control"
                id="button2"
                data-lane="2"
            >
                <span>BLUE</span>
                <strong>D</strong>
            </button>

        </div>


        <!-- ==========================
             시작 화면
        =========================== -->

        <div id="startScreen">

            <h1>
                COLOR BEAT
            </h1>

            <p>
                LEMONADE · aespa
            </p>

            <button
                id="startButton"
                type="button"
            >
                START
            </button>

        </div>


        <!-- ==========================
             음악
        =========================== -->

        <audio
            id="music"
            preload="metadata"
        >

            <source
                src="./music/lemonade.mp3"
                type="audio/mpeg"
            >

        </audio>


    </div>

</div>


<script>

    /* =================================
       요소
    ================================= */

    const music =
        document.getElementById("music");

    const startScreen =
        document.getElementById("startScreen");

    const startButton =
        document.getElementById("startButton");

    const notesContainer =
        document.getElementById("notes");

    const playArea =
        document.getElementById("playArea");

    const judgeLine =
        document.getElementById("judgeLine");

    const judge =
        document.getElementById("judge");

    const countdown =
        document.getElementById("countdown");

    const scoreText =
        document.getElementById("score");


    /* =================================
       게임 변수
    ================================= */

    let running = false;

    let animation = null;

    let hit = 0;

    let miss = 0;

    let noteIndex = 0;

    let activeNotes = [];


    /*
       테스트용 노트

       time = 음악 시작 후 판정되는 시간
       lane
         0 = 빨강
         1 = 노랑
         2 = 파랑
    */

    const testNotes = [

        {
            time: 2.0,
            lane: 0,
            color: "red"
        },

        {
            time: 2.5,
            lane: 1,
            color: "yellow"
        },

        {
            time: 3.0,
            lane: 2,
            color: "blue"
        },

        {
            time: 3.5,
            lane: 0,
            color: "red"
        },

        {
            time: 4.0,
            lane: 2,
            color: "blue"
        },

        {
            time: 4.5,
            lane: 1,
            color: "yellow"
        },

        {
            time: 5.0,
            lane: 0,
            color: "red"
        },

        {
            time: 5.35,
            lane: 1,
            color: "yellow"
        },

        {
            time: 5.70,
            lane: 2,
            color: "blue"
        }

    ];


    /*
       노트가 내려오는 시간
    */

    const travelTime = 1.5;


    /*
       판정 허용 시간
    */

    const hitWindow = 0.18;


    /* =================================
       시작 버튼
    ================================= */

    startButton.addEventListener(
        "click",
        startGame
    );


    async function startGame() {

        /*
           초기화
        */

        hit = 0;

        miss = 0;

        noteIndex = 0;

        activeNotes = [];

        notesContainer.innerHTML = "";

        updateScore();


        /*
           음악 처음으로
        */

        music.pause();

        music.currentTime = 0;


        /*
           카운트다운
        */

        startScreen.style.display =
            "none";

        await countdownStart();


        /*
           음악 재생
        */

        try {

            await music.play();

        }

        catch (error) {

            console.error(error);

            alert(
                "음악을 재생할 수 없습니다."
            );

            startScreen.style.display =
                "flex";

            return;

        }


        running = true;


        /*
           게임 루프
        */

        animation =
            requestAnimationFrame(
                gameLoop
            );

    }


    /* =================================
       카운트다운
    ================================= */

    function countdownStart() {

        return new Promise(
            function(resolve) {

                let count = 3;


                function next() {

                    if (count > 0) {

                        countdown.textContent =
                            count;

                        count--;

                        setTimeout(
                            next,
                            700
                        );

                    }

                    else {

                        countdown.textContent =
                            "START!";

                        setTimeout(
                            function() {

                                countdown.textContent =
                                    "";

                                resolve();

                            },
                            500
                        );

                    }

                }


                next();

            }
        );

    }


    /* =================================
       게임 루프
    ================================= */

    function gameLoop() {

        if (!running) {
            return;
        }


        const time =
            music.currentTime;


        createNotes(time);

        updateNotes(time);


        animation =
            requestAnimationFrame(
                gameLoop
            );

    }


    /* =================================
       노트 생성
    ================================= */

    function createNotes(time) {

        while (
            noteIndex <
            testNotes.length
        ) {

            const data =
                testNotes[noteIndex];


            const spawnTime =
                data.time -
                travelTime;


            if (
                time <
                spawnTime
            ) {

                break;

            }


            createNote(data);

            noteIndex++;

        }

    }


    /* =================================
       노트 만들기
    ================================= */

    function createNote(data) {

        const note =
            document.createElement("div");


        note.className =
            "note " +
            data.color;


        const laneWidth =
            playArea.clientWidth / 3;


        const x =
            laneWidth *
            data.lane +
            laneWidth / 2;


        note.style.left =
            x + "px";


        note.style.top =
            "-60px";


        note.dataset.lane =
            data.lane;


        note.noteTime =
            data.time;


        note.hit =
            false;


        notesContainer.appendChild(
            note
        );


        activeNotes.push(
            note
        );

    }


    /* =================================
       노트 이동
    ================================= */

    function updateNotes(time) {

        const startY =
            -60;


        const endY =
            judgeLine.offsetTop -
            26;


        for (
            let i =
                activeNotes.length - 1;

            i >= 0;

            i--
        ) {

            const note =
                activeNotes[i];


            if (note.hit) {
                continue;
            }


            const remaining =
                note.noteTime -
                time;


            let progress =
                1 -
                remaining /
                travelTime;


            progress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        progress
                    )
                );


            const y =
                startY +
                (
                    endY -
                    startY
                ) *
                progress;


            note.style.top =
                y + "px";


            /*
               판정 시간을 넘김
            */

            if (
                time -
                note.noteTime >
                hitWindow
            ) {

                missNote(note);

            }

        }

    }


    /* =================================
       키 입력
    ================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (!running) {
                return;
            }


            if (
                event.key === "a" ||
                event.key === "A"
            ) {

                pressLane(0);

            }

            else if (
                event.key === "s" ||
                event.key === "S"
            ) {

                pressLane(1);

            }

            else if (
                event.key === "d" ||
                event.key === "D"
            ) {

                pressLane(2);

            }

        }
    );


    /* =================================
       버튼 입력
    ================================= */

    document
        .querySelectorAll(".control")
        .forEach(
            function(button) {

                button.addEventListener(
                    "pointerdown",
                    function(event) {

                        event.preventDefault();

                        const lane =
                            Number(
                                this.dataset.lane
                            );

                        this.classList.add(
                            "active"
                        );

                        setTimeout(
                            () => {
                                this.classList.remove(
                                    "active"
                                );
                            },
                            100
                        );

                        pressLane(lane);

                    }
                );

            }
        );


    /* =================================
       레인 판정
    ================================= */

    function pressLane(lane) {

        const currentTime =
            music.currentTime;


        let target = null;

        let closest =
            Infinity;


        for (
            const note of activeNotes
        ) {

            if (note.hit) {
                continue;
            }


            if (
                Number(note.dataset.lane) !==
                lane
            ) {
                continue;
            }


            const difference =
                Math.abs(
                    note.noteTime -
                    currentTime
                );


            if (
                difference <
                closest
            ) {

                closest =
                    difference;

                target =
                    note;

            }

        }


        if (
            target &&
            closest <= hitWindow
        ) {

            hitNote(target);

        }

    }


    /* =================================
       HIT
    ================================= */

    function hitNote(note) {

        note.hit = true;

        hit++;

        updateScore();

        showJudge("HIT");

        removeNote(note);

    }


    /* =================================
       MISS
    ================================= */

    function missNote(note) {

        note.hit = true;

        miss++;

        updateScore();

        showJudge("MISS");

        removeNote(note);

    }


    /* =================================
       노트 제거
    ================================= */

    function removeNote(note) {

        const index =
            activeNotes.indexOf(note);


        if (index !== -1) {

            activeNotes.splice(
                index,
                1
            );

        }


        if (note.parentNode) {

            note.parentNode.removeChild(
                note
            );

        }

    }


    /* =================================
       점수 표시
    ================================= */

    function updateScore() {

        scoreText.textContent =
            "HIT " +
            hit +
            "  MISS " +
            miss;

    }


    /* =================================
       판정 표시
    ================================= */

    function showJudge(text) {

        judge.textContent =
            text;


        judge.classList.remove(
            "show"
        );


        void judge.offsetWidth;


        judge.classList.add(
            "show"
        );

    }


    /* =================================
       음악 종료
    ================================= */

    music.addEventListener(
        "ended",
        function() {

            running = false;


            if (animation) {

                cancelAnimationFrame(
                    animation
                );

            }


            alert(
                "테스트 종료\n\n" +
                "HIT: " + hit +
                "\nMISS: " + miss
            );


            startScreen.style.display =
                "flex";

        }
    );

</script>

</body>
</html>

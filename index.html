<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLOR BEAT</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
    color:white;
    font-family:Arial,"Noto Sans KR",sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   SCREEN
========================= */

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}


/* =========================
   MENU
========================= */

#menuScreen{
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 25%,
            #343442 0%,
            #14141d 35%,
            #050507 80%
        );
}

.menu{
    width:min(90%,560px);
    text-align:center;
}

.logo small{
    color:#777;
    letter-spacing:6px;
    font-size:12px;
}

.logo h1{
    margin:8px 0;
    font-size:62px;
    letter-spacing:5px;
}

.logo p{
    color:#888;
    font-size:14px;
}

.songList{
    margin-top:38px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.songButton{
    position:relative;
    overflow:hidden;

    width:100%;
    padding:19px 22px;

    border:1px solid #30303a;
    border-radius:15px;

    background:#15151d;
    color:white;

    text-align:left;

    transition:.15s;
}

.songButton:hover{
    transform:translateY(-2px);
    background:#20202a;
}

.songButton small{
    display:block;
    color:#666;
    letter-spacing:3px;
}

.songButton strong{
    display:block;
    margin-top:4px;
    font-size:22px;
}

.songButton span{
    display:block;
    margin-top:5px;
    color:#888;
}

.help{
    margin-top:20px;
    color:#555;
    font-size:12px;
}


/* =========================
   GAME
========================= */

#gameScreen{
    justify-content:center;
}

.game{
    position:relative;

    width:min(100vw,700px);
    height:100%;

    overflow:hidden;

    background:#07070c;
}


/* =========================
   HEADER
========================= */

.header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:64px;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(5,5,9,.97);

    border-bottom:1px solid #292932;
}

.backButton{
    position:absolute;
    left:12px;

    width:40px;
    height:40px;

    border:0;
    border-radius:10px;

    background:#191921;
    color:white;

    font-size:22px;
}

.songInfo{
    text-align:center;
}

.songInfo strong{
    display:block;
    font-size:16px;
}

.songInfo span{
    display:block;
    margin-top:3px;

    color:#777;
    font-size:11px;
}

.scoreBox{
    position:absolute;
    right:15px;

    text-align:right;
}

.scoreBox small{
    color:#777;
}

.scoreBox strong{
    display:block;
    font-size:18px;
}


/* =========================
   PLAY AREA
========================= */

.playArea{
    position:absolute;

    top:64px;
    bottom:130px;

    left:0;
    right:0;

    overflow:hidden;

    background:#08080e;
}


/* =========================
   PIANO LANES
========================= */

.pianoBackground{
    position:absolute;

    inset:0;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    z-index:0;
}

.pianoLane{
    position:relative;

    border-left:1px solid rgba(255,255,255,.09);
    border-right:1px solid rgba(255,255,255,.025);

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0px,
            rgba(255,255,255,.045) 2px,
            transparent 2px,
            transparent 88px
        );
}

.pianoLane::after{
    content:"";

    position:absolute;

    left:9%;
    right:9%;

    top:0;
    bottom:0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,.75) 0px,
            rgba(0,0,0,.75) 43px,
            rgba(255,255,255,.035) 43px,
            rgba(255,255,255,.035) 46px,
            rgba(0,0,0,.75) 46px,
            rgba(0,0,0,.75) 88px
        );
}

.pianoLane.red{
    box-shadow:
        inset 0 0 35px rgba(255,50,60,.06);
}

.pianoLane.yellow{
    box-shadow:
        inset 0 0 35px rgba(255,220,30,.06);
}

.pianoLane.blue{
    box-shadow:
        inset 0 0 35px rgba(50,120,255,.06);
}

.pianoLane.purple{
    box-shadow:
        inset 0 0 35px rgba(190,70,255,.06);
}


/* =========================
   NOTES
========================= */

.notes{
    position:absolute;
    inset:0;

    z-index:20;
}


/* 일반 음표 */

.note{
    position:absolute;

    width:42px;
    height:52px;

    transform:translateX(-50%);

    filter:
        drop-shadow(
            0 0 8px currentColor
        );
}

.note::before{
    content:"";

    position:absolute;

    left:4px;
    bottom:5px;

    width:28px;
    height:28px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 12px currentColor,
        0 0 25px currentColor;
}

.note::after{
    content:"";

    position:absolute;

    left:27px;
    top:1px;

    width:5px;
    height:39px;

    border-radius:5px;

    background:currentColor;

    box-shadow:
        0 0 8px currentColor;
}

.note.red{
    color:#ff3d48;
}

.note.yellow{
    color:#ffe329;
}

.note.blue{
    color:#3d8cff;
}

.note.purple{
    color:#bd55ff;
}


/* =========================
   LONG NOTE
========================= */

.longNote{
    position:absolute;

    width:26px;

    border-radius:10px;

    transform:translateX(-50%);

    z-index:19;

    opacity:.9;

    box-shadow:
        0 0 10px currentColor,
        0 0 25px currentColor;
}

.longNote::before{
    content:"";

    position:absolute;

    top:0;
    left:50%;

    width:34px;
    height:14px;

    transform:translateX(-50%);

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 12px currentColor;
}

.longNote.red{
    color:#ff3d48;
}

.longNote.yellow{
    color:#ffe329;
}

.longNote.blue{
    color:#3d8cff;
}

.longNote.purple{
    color:#bd55ff;
}

.longNote.holding{
    filter:
        brightness(1.6)
        drop-shadow(
            0 0 15px currentColor
        );
}


/* =========================
   JUDGE LINE
========================= */

.judgeLine{
    position:absolute;

    left:0;
    right:0;

    bottom:32px;

    height:4px;

    z-index:40;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 25px rgba(255,255,255,.8);
}


/* =========================
   JUDGE
========================= */

.judge{
    position:absolute;

    left:50%;
    top:34%;

    transform:translate(-50%,-50%);

    z-index:80;

    font-size:34px;
    font-weight:900;

    opacity:0;

    pointer-events:none;
}

.judge.show{
    animation:
        judgeAnimation .35s ease-out;
}

.judge.miss{
    color:#ff3030;

    text-shadow:
        0 0 12px #ff0000,
        0 0 25px #ff0000;
}

.judge.hit{
    color:white;

    text-shadow:
        0 0 15px white;
}

@keyframes judgeAnimation{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.7);
    }

    25%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================
   COUNTDOWN
========================= */

.countdown{
    position:absolute;

    left:50%;
    top:42%;

    transform:translate(-50%,-50%);

    z-index:100;

    font-size:78px;
    font-weight:900;

    text-shadow:
        0 0 25px white;
}


/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:130px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    z-index:100;

    background:#08080d;
}

.control{
    position:relative;

    border:0;
    border-top:3px solid;

    background:#101018;

    color:white;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    transition:
        transform .06s,
        background .06s;
}

.control::before{
    content:"";

    position:absolute;

    top:8px;
    bottom:8px;

    width:86%;

    border-radius:8px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.035),
            transparent
        );

    pointer-events:none;
}

.control small{
    color:#777;
    font-size:10px;
}

.control strong{
    font-size:30px;
}

.control.red{
    border-color:#ff3d48;
}

.control.yellow{
    border-color:#ffe329;
}

.control.blue{
    border-color:#3d8cff;
}

.control.purple{
    border-color:#bd55ff;
}

.control.red.active{
    background:rgba(255,61,72,.3);
}

.control.yellow.active{
    background:rgba(255,227,41,.25);
}

.control.blue.active{
    background:rgba(61,140,255,.28);
}

.control.purple.active{
    background:rgba(189,85,255,.28);
}

.control.active{
    transform:scale(.96);
}


/* =========================
   START
========================= */

.startOverlay{
    position:absolute;

    inset:0;

    z-index:150;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:rgba(4,4,8,.96);
}

.startOverlay h2{
    margin:0;

    font-size:46px;
}

.startOverlay p{
    color:#777;
}

.startButton{
    margin-top:24px;

    padding:15px 60px;

    border:0;
    border-radius:12px;

    background:white;
    color:#111;

    font-weight:bold;
}


/* =========================
   RESULT
========================= */

#resultScreen{
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 30%,
            #303040,
            #08080d 70%
        );
}

.result{
    width:min(90%,520px);

    text-align:center;
}

.result small{
    color:#777;
    letter-spacing:4px;
}

.result h1{
    margin:8px 0;

    font-size:70px;
}

.resultSong{
    color:#888;
}

.finalScore{
    margin-top:30px;

    font-size:68px;
    font-weight:900;
}

.resultStats{
    margin-top:25px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:10px;
}

.resultStat{
    padding:17px;

    border-radius:12px;

    background:#15151d;
}

.resultStat small{
    display:block;

    letter-spacing:0;
}

.resultStat strong{
    display:block;

    margin-top:6px;

    font-size:22px;
}

.reward{
    margin-top:20px;

    padding:18px;

    border-radius:14px;

    background:#15151d;

    border:1px solid #30303a;
}

.rewardIcon{
    font-size:35px;
}

.rewardTitle{
    display:block;

    margin-top:6px;

    font-size:19px;
}

.rewardMessage{
    margin-bottom:0;

    color:#888;
}

.resultButtons{
    margin-top:18px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;
}

.resultButtons button{
    padding:15px;

    border:0;
    border-radius:10px;

    background:#24242d;

    color:white;
}

.resultButtons button:first-child{
    background:white;
    color:#111;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .logo h1{
        font-size:44px;
    }

    .header{
        height:58px;
    }

    .playArea{
        top:58px;
        bottom:115px;
    }

    .controls{
        height:115px;
    }

    .note{
        transform:
            translateX(-50%)
            scale(.85);
    }

    .longNote{
        width:21px;
    }

    .finalScore{
        font-size:58px;
    }

}
</style>
</head>


<body>


<!-- ==================================================
     MENU
================================================== -->

<section
    id="menuScreen"
    class="screen active"
>

    <div class="menu">

        <div class="logo">

            <small>RHYTHM GAME</small>

            <h1>COLOR BEAT</h1>

            <p>
                음악의 박자에 맞춰 키를 입력하세요
            </p>

        </div>


        <div class="songList">

            <button
                class="songButton"
                data-song="lemonade"
            >

                <small>SONG 01</small>

                <strong>
                    LEMONADE
                </strong>

                <span>
                    aespa
                </span>

            </button>


            <button
                class="songButton"
                data-song="loveAttack"
            >

                <small>SONG 02</small>

                <strong>
                    LOVE ATTACK
                </strong>

                <span>
                    RESCENE
                </span>

            </button>


            <button
                class="songButton"
                data-song="blueValentine"
            >

                <small>SONG 03</small>

                <strong>
                    BLUE VALENTINE
                </strong>

                <span>
                    NMIXX
                </span>

            </button>

        </div>


        <div class="help">
            A · S · D · F
        </div>

    </div>

</section>


<!-- ==================================================
     GAME
================================================== -->

<section
    id="gameScreen"
    class="screen"
>

    <div class="game">


        <div class="header">

            <button
                class="backButton"
                id="backButton"
            >
                ←
            </button>


            <div class="songInfo">

                <strong id="gameTitle">
                    LEMONADE
                </strong>

                <span id="gameArtist">
                    aespa
                </span>

            </div>


            <div class="scoreBox">

                <small>
                    SCORE
                </small>

                <strong id="scoreText">
                    0
                </strong>

            </div>

        </div>


        <div class="playArea">


            <!-- 4개의 피아노 레인 -->

            <div class="pianoBackground">

                <div class="pianoLane red"></div>

                <div class="pianoLane yellow"></div>

                <div class="pianoLane blue"></div>

                <div class="pianoLane purple"></div>

            </div>


            <div
                class="notes"
                id="notes"
            ></div>


            <div class="judgeLine"></div>


            <div
                class="judge"
                id="judge"
            ></div>


            <div
                class="countdown"
                id="countdown"
            ></div>


        </div>


        <!-- A S D F -->

        <div class="controls">

            <button
                class="control red"
                data-lane="0"
            >

                <small>RED</small>

                <strong>A</strong>

            </button>


            <button
                class="control yellow"
                data-lane="1"
            >

                <small>YELLOW</small>

                <strong>S</strong>

            </button>


            <button
                class="control blue"
                data-lane="2"
            >

                <small>BLUE</small>

                <strong>D</strong>

            </button>


            <button
                class="control purple"
                data-lane="3"
            >

                <small>PURPLE</small>

                <strong>F</strong>

            </button>

        </div>


        <div
            class="startOverlay"
            id="startOverlay"
        >

            <h2 id="startTitle">
                LEMONADE
            </h2>

            <p id="startArtist">
                aespa
            </p>

            <button
                class="startButton"
                id="startButton"
            >
                START
            </button>

        </div>


        <audio
            id="music"
            preload="auto"
        ></audio>

    </div>

</section>


<!-- ==================================================
     RESULT
================================================== -->

<section
    id="resultScreen"
    class="screen"
>

    <div class="result">

        <small>
            RESULT
        </small>


        <h1 id="resultTitle">
            CLEAR
        </h1>


        <div
            class="resultSong"
            id="resultSong"
        ></div>


        <div
            class="finalScore"
            id="finalScore"
        >
            0 / 100
        </div>


        <div class="resultStats">

            <div class="resultStat">

                <small>
                    HIT
                </small>

                <strong id="resultHit">
                    0
                </strong>

            </div>


            <div class="resultStat">

                <small>
                    MISS
                </small>

                <strong id="resultMiss">
                    0
                </strong>

            </div>

        </div>


        <div class="reward">

            <div
                class="rewardIcon"
                id="rewardIcon"
            >
                🎁
            </div>


            <strong
                class="rewardTitle"
                id="rewardTitle"
            >
                CLEAR REWARD
            </strong>


            <p
                class="rewardMessage"
                id="rewardMessage"
            >
                모든 음표를 맞혔습니다!
            </p>

        </div>


        <div class="resultButtons">

            <button id="retryButton">
                다시 하기
            </button>

            <button id="menuButton">
                곡 선택
            </button>

        </div>

    </div>

</section>


<script>

/* ==================================================
   SONG DATA
================================================== */

const songs = {

    lemonade:{
        title:"LEMONADE",
        artist:"aespa",

        file:"./music/lemonade.mp3",

        bpm:129.20,

        offset:0.21,

        duration:187.09,

        difficulty:1.00
    },


    loveAttack:{
        title:"LOVE ATTACK",
        artist:"RESCENE",

        file:"./music/love_attack.mp3",

        bpm:112.35,

        offset:0.19,

        duration:181.63,

        difficulty:1.08
    },


    blueValentine:{
        title:"BLUE VALENTINE",
        artist:"NMIXX",

        file:"./music/blue_valentine.mp3",

        bpm:161.50,

        offset:0.58,

        duration:186.10,

        difficulty:1.20
    }

};


/* ==================================================
   ELEMENTS
================================================== */

const menuScreen =
    document.getElementById(
        "menuScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const startOverlay =
    document.getElementById(
        "startOverlay"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const retryButton =
    document.getElementById(
        "retryButton"
    );

const menuButton =
    document.getElementById(
        "menuButton"
    );

const music =
    document.getElementById(
        "music"
    );

const notes =
    document.getElementById(
        "notes"
    );

const judge =
    document.getElementById(
        "judge"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const scoreText =
    document.getElementById(
        "scoreText"
    );


/* ==================================================
   VARIABLES
================================================== */

let currentSong =
    songs.lemonade;

let running =
    false;

let animation =
    null;

let chart =
    [];

let chartIndex =
    0;

let activeNotes =
    [];

let hit =
    0;

let miss =
    0;

let totalNotes =
    0;


/*
   판정 범위

   ±0.10초
*/

const hitWindow =
    0.10;


/*
   기본 이동 시간

   곡이 진행될수록
   실제 이동시간이 감소해서
   속도가 빨라짐.
*/

const baseTravelTime =
    1.55;


/* ==================================================
   SELECT SONG
================================================== */

document
.querySelectorAll(".songButton")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const id =
                button.dataset.song;

            if(!songs[id]){
                return;
            }

            currentSong =
                songs[id];

            openGame();

        }
    );

});


/* ==================================================
   OPEN GAME
================================================== */

function openGame(){

    menuScreen.classList.remove(
        "active"
    );

    resultScreen.classList.remove(
        "active"
    );

    gameScreen.classList.add(
        "active"
    );


    document.getElementById(
        "gameTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "gameArtist"
    ).textContent =
        currentSong.artist;


    document.getElementById(
        "startTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "startArtist"
    ).textContent =
        currentSong.artist;


    resetGame();

}


/* ==================================================
   RESET
================================================== */

function resetGame(){

    stopGame();


    hit =
        0;

    miss =
        0;

    chartIndex =
        0;


    activeNotes =
        [];


    notes.innerHTML =
        "";


    chart =
        createChart(
            currentSong
        );


    totalNotes =
        chart.length;


    music.src =
        currentSong.file;


    updateScore();

}


/* ==================================================
   CREATE CHART
================================================== */

function createChart(song){

    const result =
        [];

    const beat =
        60 /
        song.bpm;


    let time =
        song.offset +
        0.25;


    let previousLane =
        -1;


    let noteNumber =
        0;


    while(
        time <
        song.duration - 2
    ){

        const progress =
            time /
            song.duration;


        /*
           곡 진행에 따라
           밀도 상승
        */

        let density;


        if(progress < 0.10){

            density =
                0.48;

        }
        else if(progress < 0.25){

            density =
                0.65;

        }
        else if(progress < 0.45){

            density =
                0.78;

        }
        else if(progress < 0.65){

            density =
                0.88;

        }
        else if(progress < 0.82){

            density =
                0.96;

        }
        else{

            density =
                1.0;

        }


        density *=
            song.difficulty;


        /*
           4레인 패턴
        */

        let lane =
            noteNumber %
            4;


        /*
           반복 방지
        */

        if(
            lane === previousLane
        ){

            lane =
                (
                    lane + 1
                ) % 4;

        }


        /*
           일반 / 롱노트 비율

           후반부로 갈수록
           롱노트 증가
        */

        let longChance =
            0.08;


        if(progress > 0.35){
            longChance = 0.12;
        }

        if(progress > 0.60){
            longChance = 0.17;
        }

        if(progress > 0.80){
            longChance = 0.22;
        }


        if(
            Math.random() <
            density
        ){

            const isLong =
                Math.random() <
                longChance;


            let duration =
                0;


            if(isLong){

                /*
                   0.5~1.4초
                */

                duration =
                    0.5 +
                    Math.random() *
                    0.9;

            }


            result.push({

                time:
                    Number(
                        time.toFixed(3)
                    ),

                lane:
                    lane,

                type:
                    isLong
                    ? "long"
                    : "normal",

                duration:
                    Number(
                        duration.toFixed(3)
                    )

            });


            previousLane =
                lane;

            noteNumber++;


            /*
               후반부 추가 노트
            */

            if(
                progress > 0.45 &&
                Math.random() <
                density * 0.25
            ){

                let secondLane =
                    (
                        lane +
                        1 +
                        Math.floor(
                            Math.random()*3
                        )
                    ) % 4;


                result.push({

                    time:
                        Number(
                            (
                                time +
                                beat / 2
                            ).toFixed(3)
                        ),

                    lane:
                        secondLane,

                    type:
                        "normal",

                    duration:
                        0

                });

            }

        }


        /*
           후반으로 갈수록
           간격 감소

           → 속도 증가
        */

        let interval =
            beat;


        if(progress > 0.30){

            interval =
                beat * 0.90;

        }

        if(progress > 0.50){

            interval =
                beat * 0.78;

        }

        if(progress > 0.70){

            interval =
                beat * 0.67;

        }

        if(progress > 0.85){

            interval =
                beat * 0.58;

        }


        time +=
            interval;

    }


    result.sort(
        (a,b)=>
            a.time -
            b.time
    );


    return result;

}


/* ==================================================
   START
================================================== */

startButton.addEventListener(
    "click",
    startGame
);


async function startGame(){

    resetGame();


    startOverlay.style.display =
        "none";


    await countdownStart();


    try{

        music.currentTime =
            0;

        await music.play();

    }
    catch(error){

        console.error(error);

        alert(
            "음악을 재생할 수 없습니다.\n\n" +
            "music 폴더 안의 MP3 파일 이름을 확인해주세요."
        );


        startOverlay.style.display =
            "flex";

        return;

    }


    running =
        true;


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   COUNTDOWN
================================================== */

function countdownStart(){

    return new Promise(resolve=>{

        let number =
            3;


        function next(){

            if(number > 0){

                countdown.textContent =
                    number;

                number--;


                setTimeout(
                    next,
                    600
                );

            }
            else{

                countdown.textContent =
                    "START!";


                setTimeout(
                    ()=>{

                        countdown.textContent =
                            "";

                        resolve();

                    },
                    450
                );

            }

        }


        next();

    });

}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop(){

    if(!running){
        return;
    }


    const time =
        music.currentTime;


    spawnNotes(
        time
    );


    updateNotes(
        time
    );


    checkLongNotes(
        time
    );


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   CURRENT TRAVEL TIME
================================================== */

function getTravelTime(noteTime){

    const progress =
        noteTime /
        currentSong.duration;


    let speed =
        baseTravelTime;


    if(progress > 0.25){

        speed *=
            0.92;

    }

    if(progress > 0.45){

        speed *=
            0.84;

    }

    if(progress > 0.65){

        speed *=
            0.75;

    }

    if(progress > 0.82){

        speed *=
            0.66;

    }


    return speed;

}


/* ==================================================
   SPAWN
================================================== */

function spawnNotes(time){

    while(
        chartIndex <
        chart.length
    ){

        const data =
            chart[chartIndex];


        const travel =
            getTravelTime(
                data.time
            );


        const spawnTime =
            data.time -
            travel;


        if(
            time <
            spawnTime
        ){

            break;

        }


        createNote(
            data
        );


        chartIndex++;

    }

}


/* ==================================================
   CREATE NOTE
================================================== */

function createNote(data){

    const colors = [
        "red",
        "yellow",
        "blue",
        "purple"
    ];


    const playArea =
        document.querySelector(
            ".playArea"
        );


    const laneWidth =
        playArea.clientWidth /
        4;


    const x =
        laneWidth *
        data.lane +
        laneWidth / 2;


    /*
       일반 노트
    */

    if(
        data.type ===
        "normal"
    ){

        const note =
            document.createElement(
                "div"
            );


        note.className =
            "note " +
            colors[data.lane];


        note.style.left =
            x + "px";


        note.style.top =
            "-70px";


        note.dataset.lane =
            data.lane;


        note.noteTime =
            data.time;


        note.type =
            "normal";


        note.hit =
            false;


        notes.appendChild(
            note
        );


        activeNotes.push(
            note
        );

        return;

    }


    /*
       롱노트
    */

    if(
        data.type ===
        "long"
    ){

        const longNote =
            document.createElement(
                "div"
            );


        longNote.className =
            "longNote " +
            colors[data.lane];


        longNote.style.left =
            x + "px";


        longNote.style.top =
            "-100px";


        longNote.dataset.lane =
            data.lane;


        longNote.noteTime =
            data.time;


        longNote.endTime =
            data.time +
            data.duration;


        longNote.duration =
            data.duration;


        longNote.type =
            "long";


        longNote.hit =
            false;


        longNote.holding =
            false;


        longNote.completed =
            false;


        notes.appendChild(
            longNote
        );


        activeNotes.push(
            longNote
        );

    }

}


/* ==================================================
   UPDATE NOTES
================================================== */

function updateNotes(time){

    const line =
        document.querySelector(
            ".judgeLine"
        );


    const startY =
        -100;


    const endY =
        line.offsetTop -
        15;


    for(
        let i =
            activeNotes.length - 1;

        i >= 0;

        i--
    ){

        const note =
            activeNotes[i];


        if(note.hit){
            continue;
        }


        const travel =
            getTravelTime(
                note.noteTime
            );


        const remaining =
            note.noteTime -
            time;


        let progress =
            1 -
            remaining /
            travel;


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        const y =
            startY +
            (
                endY -
                startY
            ) *
            progress;


        if(
            note.type ===
            "normal"
        ){

            note.style.top =
                y + "px";

        }


        if(
            note.type ===
            "long"
        ){

            const endDistance =
                note.endTime -
                time;


            const endProgress =
                1 -
                endDistance /
                travel;


            const endYPosition =
                startY +
                (
                    endY -
                    startY
                ) *
                endProgress;


            const height =
                Math.max(
                    40,
                    endYPosition -
                    y
                );


            note.style.top =
                y + "px";


            note.style.height =
                height + "px";

        }


        /*
           일반 노트 MISS
        */

        if(
            note.type ===
            "normal" &&
            time -
            note.noteTime >
            hitWindow
        ){

            missNote(
                note
            );

        }


        /*
           롱노트 시작 타이밍을
           지나치면 MISS
        */

        if(
            note.type ===
            "long" &&
            !note.holding &&
            time -
            note.noteTime >
            hitWindow
        ){

            missNote(
                note
            );

        }

    }

}


/* ==================================================
   KEY DOWN
================================================== */

const heldKeys =
    new Set();


document.addEventListener(
    "keydown",
    event=>{

        if(!running){
            return;
        }


        let lane =
            -1;


        if(
            event.key ===
            "a" ||
            event.key ===
            "A"
        ){

            lane =
                0;

        }

        else if(
            event.key ===
            "s" ||
            event.key ===
            "S"
        ){

            lane =
                1;

        }

        else if(
            event.key ===
            "d" ||
            event.key ===
            "D"
        ){

            lane =
                2;

        }

        else if(
            event.key ===
            "f" ||
            event.key ===
            "F"
        ){

            lane =
                3;

        }


        if(
            lane === -1
        ){

            return;

        }


        event.preventDefault();


        /*
           이미 누르고 있는 키면
           연속 keydown 무시
        */

        if(
            heldKeys.has(
                lane
            )
        ){

            return;

        }


        heldKeys.add(
            lane
        );


        visualPress(
            lane
        );


        pressLane(
            lane
        );

    }
);


/* ==================================================
   KEY UP
================================================== */

document.addEventListener(
    "keyup",
    event=>{

        let lane =
            -1;


        if(
            event.key ===
            "a" ||
            event.key ===
            "A"
        ){

            lane =
                0;

        }

        else if(
            event.key ===
            "s" ||
            event.key ===
            "S"
        ){

            lane =
                1;

        }

        else if(
            event.key ===
            "d" ||
            event.key ===
            "D"
        ){

            lane =
                2;

        }

        else if(
            event.key ===
            "f" ||
            event.key ===
            "F"
        ){

            lane =
                3;

        }


        if(
            lane !== -1
        ){

            heldKeys.delete(
                lane
            );


            releaseLongNote(
                lane
            );

        }

    }
);


/* ==================================================
   PRESS LANE
================================================== */

function pressLane(lane){

    if(!running){
        return;
    }


    const now =
        music.currentTime;


    let target =
        null;


    let closest =
        Infinity;


    for(
        const note of activeNotes
    ){

        if(note.hit){
            continue;
        }


        if(
            Number(
                note.dataset.lane
            ) !== lane
        ){

            continue;

        }


        const distance =
            Math.abs(
                note.noteTime -
                now
            );


        if(
            distance <
            closest
        ){

            closest =
                distance;

            target =
                note;

        }

    }


    /*
       음표가 없거나
       판정 범위 밖
    */

    if(
        !target ||
        closest >
        hitWindow
    ){

        miss++;

        updateScore();

        showJudge(
            "MISS",
            "miss"
        );

        return;

    }


    /*
       일반 노트
    */

    if(
        target.type ===
        "normal"
    ){

        hit++;

        target.hit =
            true;

        removeNote(
            target
        );

        updateScore();

        showJudge(
            "HIT",
            "hit"
        );

        return;

    }


    /*
       롱노트 시작
    */

    if(
        target.type ===
        "long"
    ){

        target.holding =
            true;

        target.classList.add(
            "holding"
        );

        showJudge(
            "HIT",
            "hit"
        );

    }

}


/* ==================================================
   LONG NOTE CHECK
================================================== */

function checkLongNotes(time){

    for(
        const note of activeNotes
    ){

        if(
            note.type !==
            "long"
        ){

            continue;

        }


        if(
            note.hit
        ){

            continue;

        }


        /*
           누르고 있는 상태
        */

        if(
            note.holding
        ){

            const lane =
                Number(
                    note.dataset.lane
                );


            /*
               키가 떼졌으면
               실패
            */

            if(
                !heldKeys.has(
                    lane
                )
            ){

                miss++;

                note.hit =
                    true;

                removeNote(
                    note
                );

                updateScore();

                showJudge(
                    "MISS",
                    "miss"
                );

                continue;

            }


            /*
               끝까지 유지 성공
            */

            if(
                time >=
                note.endTime
            ){

                hit++;

                note.hit =
                    true;

                note.completed =
                    true;

                removeNote(
                    note
                );

                updateScore();

            }

        }

    }

}


/* ==================================================
   RELEASE LONG NOTE
================================================== */

function releaseLongNote(lane){

    for(
        const note of activeNotes
    ){

        if(
            note.type !==
            "long"
        ){

            continue;

        }


        if(
            Number(
                note.dataset.lane
            ) !== lane
        ){

            continue;

        }


        if(
            !note.holding ||
            note.hit
        ){

            continue;

        }


        /*
           아직 끝나지 않았는데
           손을 떼면 MISS
        */

        miss++;

        note.hit =
            true;

        removeNote(
            note
        );

        updateScore();

        showJudge(
            "MISS",
            "miss"
        );

    }

}


/* ==================================================
   MISS
================================================== */

function missNote(note){

    if(note.hit){
        return;
    }


    note.hit =
        true;


    miss++;


    removeNote(
        note
    );


    updateScore();


    showJudge(
        "MISS",
        "miss"
    );

}


/* ==================================================
   REMOVE
================================================== */

function removeNote(note){

    const index =
        activeNotes.indexOf(
            note
        );


    if(index !== -1){

        activeNotes.splice(
            index,
            1
        );

    }


    if(note.parentNode){

        note.parentNode.removeChild(
            note
        );

    }

}


/* ==================================================
   SCORE
================================================== */

function getScore(){

    if(
        totalNotes <= 0
    ){

        return 0;

    }


    return Math.round(
        hit /
        totalNotes *
        100
    );

}


function updateScore(){

    scoreText.textContent =
        getScore();

}


/* ==================================================
   VISUAL BUTTON
================================================== */

function visualPress(lane){

    const button =
        document.querySelector(
            `.control[data-lane="${lane}"]`
        );


    if(!button){
        return;
    }


    button.classList.add(
        "active"
    );

}


function visualRelease(lane){

    const button =
        document.querySelector(
            `.control[data-lane="${lane}"]`
        );


    if(!button){
        return;
    }


    button.classList.remove(
        "active"
    );

}


/*
   키를 계속 누르고 있을 때
   active 상태 유지
*/

document.addEventListener(
    "keyup",
    event=>{

        let lane =
            -1;


        if(
            event.key.toLowerCase() ===
            "a"
        ){

            lane =
                0;

        }

        else if(
            event.key.toLowerCase() ===
            "s"
        ){

            lane =
                1;

        }

        else if(
            event.key.toLowerCase() ===
            "d"
        ){

            lane =
                2;

        }

        else if(
            event.key.toLowerCase() ===
            "f"
        ){

            lane =
                3;

        }


        if(
            lane !== -1
        ){

            visualRelease(
                lane
            );

        }

    }
);


/* ==================================================
   JUDGE
================================================== */

function showJudge(
    text,
    type
){

    judge.textContent =
        text;


    judge.className =
        "judge " +
        type;


    void judge.offsetWidth;


    judge.classList.add(
        "show"
    );

}


/* ==================================================
   MUSIC END
================================================== */

music.addEventListener(
    "ended",
    finishGame
);


function finishGame(){

    if(!running){
        return;
    }


    running =
        false;


    if(animation){

        cancelAnimationFrame(
            animation
        );

    }


    /*
       남은 노트 전부 MISS
    */

    for(
        const note of [
            ...activeNotes
        ]
    ){

        if(
            !note.hit
        ){

            note.hit =
                true;

            miss++;

            removeNote(
                note
            );

        }

    }


    updateScore();


    const finalScore =
        getScore();


    const cleared =
        finalScore === 100;


    showResult(
        cleared,
        finalScore
    );

}


/* ==================================================
   RESULT
================================================== */

function showResult(
    cleared,
    finalScore
){

    gameScreen.classList.remove(
        "active"
    );


    resultScreen.classList.add(
        "active"
    );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    resultTitle.textContent =
        cleared
        ? "CLEAR"
        : "FAILED";


    resultTitle.style.color =
        cleared
        ? "white"
        : "#ff3030";


    document.getElementById(
        "resultSong"
    ).textContent =
        currentSong.title +
        " · " +
        currentSong.artist;


    document.getElementById(
        "finalScore"
    ).textContent =
        finalScore +
        " / 100";


    document.getElementById(
        "resultHit"
    ).textContent =
        hit;


    document.getElementById(
        "resultMiss"
    ).textContent =
        miss;


    if(cleared){

        document.getElementById(
            "rewardIcon"
        ).textContent =
            "🎁";


        document.getElementById(
            "rewardTitle"
        ).textContent =
            "CLEAR REWARD";


        document.getElementById(
            "rewardMessage"
        ).textContent =
            "모든 음표를 정확하게 처리했습니다!";

    }
    else{

        document.getElementById(
            "rewardIcon"
        ).textContent =
            "❌";


        document.getElementById(
            "rewardTitle"
        ).textContent =
            "NO REWARD";


        document.getElementById(
            "rewardMessage"
        ).textContent =
            "100점을 만들어야 클리어할 수 있습니다.";

    }

}

/* ==================================================
   STOP
================================================== */

function stopGame(){

    running =
        false;


    if(animation){

        cancelAnimationFrame(
            animation
        );

        animation =
            null;

    }


    music.pause();


    try{

        music.currentTime =
            0;

    }
    catch(e){}


    notes.innerHTML =
        "";


    activeNotes =
        [];


    heldKeys.clear();


    document
    .querySelectorAll(".control")
    .forEach(
        button=>
            button.classList.remove(
                "active"
            )
    );

}

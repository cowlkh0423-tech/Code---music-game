<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>COLOR BEAT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050508;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   공통 화면
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}

/* =========================
   메뉴
========================= */

#menu {
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #202038 0%,
            #0c0c13 55%,
            #050508 100%
        );
}

.logo {
    font-size: clamp(42px, 10vw, 78px);
    font-weight: 900;
    letter-spacing: 7px;

    margin-bottom: 10px;

    text-shadow:
        0 0 15px rgba(255,255,255,.35),
        0 0 40px rgba(80,120,255,.25);
}

.subtitle {
    color: #999;
    margin-bottom: 35px;
    font-size: 15px;
}

.song-list {
    width: min(90%, 600px);

    display: flex;
    flex-direction: column;

    gap: 14px;
}

.song-button {
    width: 100%;
    min-height: 88px;

    border: 1px solid #353540;
    border-radius: 16px;

    background: #111119;

    color: white;

    text-align: left;

    padding: 17px 22px;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform .1s,
        background .1s,
        border-color .1s;
}

.song-button:active {
    transform: scale(.97);
    background: #20202b;
}

.song-number {
    display: block;
    color: #777;
    font-size: 12px;
    margin-bottom: 5px;
}

.song-name {
    display: block;

    font-size: 22px;
    font-weight: 800;
}

.song-artist {
    display: block;

    margin-top: 5px;

    color: #999;
}

/* =========================
   게임
========================= */

#game {
    flex-direction: column;
    background: #050508;
}

#top {
    position: fixed;

    left: 0;
    right: 0;
    top: 0;

    height: 62px;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(5,5,8,.95);

    border-bottom: 1px solid #222;
}

#songTitle {
    font-size: 15px;
    font-weight: bold;
}

#gameStatus {
    color: #aaa;
    font-size: 13px;
}

/* =========================
   플레이 영역
========================= */

#playArea {
    position: absolute;

    top: 62px;
    bottom: 0;

    left: 50%;

    transform: translateX(-50%);

    width: min(96vw, 650px);

    overflow: hidden;

    border-left: 1px solid #25252e;
    border-right: 1px solid #25252e;

    background:
        linear-gradient(
            90deg,

            rgba(255,50,60,.045) 0%,
            rgba(255,50,60,.045) 33.333%,

            rgba(255,220,40,.045) 33.333%,
            rgba(255,220,40,.045) 66.666%,

            rgba(40,130,255,.045) 66.666%,
            rgba(40,130,255,.045) 100%
        );
}

/* 레인 */

.lane {
    position: absolute;

    top: 0;
    bottom: 0;

    width: 33.333%;

    border-right: 1px solid rgba(255,255,255,.055);
}

.lane:nth-child(1) {
    left: 0;
}

.lane:nth-child(2) {
    left: 33.333%;
}

.lane:nth-child(3) {
    left: 66.666%;

    border-right: none;
}

/* =========================
   판정선
========================= */

#judgeLine {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 125px;

    height: 5px;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,.5);

    z-index: 30;
}

/* =========================
   입력 버튼
========================= */

#keys {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 20px;

    height: 85px;

    display: flex;

    z-index: 50;
}

.key {
    width: 33.333%;

    margin: 4px;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 27px;
    font-weight: 900;

    border: 1px solid rgba(255,255,255,.1);

    background: rgba(255,255,255,.035);

    transition: transform .05s;
}

.key.red {
    color: #ff4755;
}

.key.yellow {
    color: #ffe13b;
}

.key.blue {
    color: #4899ff;
}

.key.pressed {
    transform: scale(.92);

    background: rgba(255,255,255,.2);
}

/* =========================
   원
========================= */

.note {
    position: absolute;

    width: 54px;
    height: 54px;

    border-radius: 50%;

    transform: translateX(-50%);

    z-index: 20;

    box-shadow:
        0 0 10px currentColor,
        0 0 25px currentColor;
}

.note.red {
    background: #ff3948;
    color: #ff3948;
}

.note.yellow {
    background: #ffdc35;
    color: #ffdc35;
}

.note.blue {
    background: #378eff;
    color: #378eff;
}

/* =========================
   판정 글자
========================= */

#judgeText {
    position: fixed;

    left: 50%;
    bottom: 215px;

    transform: translateX(-50%);

    z-index: 200;

    font-size: 31px;
    font-weight: 900;

    opacity: 0;

    pointer-events: none;
}

#judgeText.show {
    animation: judgeAnimation .32s ease-out;
}

@keyframes judgeAnimation {

    0% {
        opacity: 1;
        transform:
            translate(-50%, 10px)
            scale(.8);
    }

    30% {
        opacity: 1;
        transform:
            translate(-50%, 0)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -30px)
            scale(1.05);
    }
}

.perfect {
    color: white;
}

.good {
    color: #ffe34c;
}

.miss {
    color: #ff4d55;
}

/* =========================
   시작 표시
========================= */

#startOverlay {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.55);

    font-size: 65px;
    font-weight: 900;
}

#startOverlay.show {
    display: flex;
}

/* =========================
   결과
========================= */

#result {
    flex-direction: column;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #202038,
            #07070c 70%
        );
}

#resultTitle {
    font-size: clamp(50px, 12vw, 80px);

    font-weight: 900;

    margin-bottom: 25px;
}

#resultTitle.clear {
    color: #5cff8b;

    text-shadow:
        0 0 20px rgba(92,255,139,.4);
}

#resultTitle.failed {
    color: #ff5555;

    text-shadow:
        0 0 20px rgba(255,85,85,.4);
}

.resultBox {
    width: min(90%, 450px);

    padding: 25px;

    border-radius: 18px;

    border: 1px solid #292936;

    background: rgba(255,255,255,.05);

    margin-bottom: 22px;
}

.resultRow {
    display: flex;

    justify-content: space-between;

    padding: 9px 0;

    color: #aaa;
}

.resultRow strong {
    color: white;
}

.resultButtons {
    display: flex;
    gap: 12px;
}

.resultButton {
    min-width: 145px;

    padding: 14px 20px;

    border-radius: 12px;

    border: 1px solid #444;

    background: #16161f;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

/* =========================
   모바일
========================= */

@media(max-width:600px) {

    #top {
        padding: 0 12px;
    }

    #songTitle {
        font-size: 13px;
    }

    #gameStatus {
        font-size: 11px;
    }

    .note {
        width: 48px;
        height: 48px;
    }

    #judgeLine {
        bottom: 115px;
    }

    #keys {
        height: 70px;
        bottom: 20px;
    }

    .key {
        font-size: 23px;
    }

    #judgeText {
        bottom: 195px;
    }
}
</style>
</head>

<body>


<!-- =========================
     곡 선택
========================= -->

<div id="menu" class="screen active">

    <div class="logo">
        COLOR BEAT
    </div>

    <div class="subtitle">
        음악의 박자에 맞춰 원을 터뜨리세요
    </div>

    <div class="song-list">

        <button
            class="song-button"
            onclick="startSong('loveAttack')">

            <span class="song-number">
                SONG 01
            </span>

            <span class="song-name">
                LOVE ATTACK
            </span>

            <span class="song-artist">
                RESCENE
            </span>

        </button>


        <button
            class="song-button"
            onclick="startSong('lemonade')">

            <span class="song-number">
                SONG 02
            </span>

            <span class="song-name">
                LEMONADE
            </span>

            <span class="song-artist">
                aespa
            </span>

        </button>


        <button
            class="song-button"
            onclick="startSong('blueValentine')">

            <span class="song-number">
                SONG 03
            </span>

            <span class="song-name">
                Blue Valentine
            </span>

            <span class="song-artist">
                NMIXX
            </span>

        </button>

    </div>

</div>


<!-- =========================
     게임
========================= -->

<div id="game" class="screen">

    <div id="top">

        <div id="songTitle">
            COLOR BEAT
        </div>

        <div id="gameStatus">
            성공 0 · MISS 0
        </div>

    </div>


    <div id="playArea">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <div id="judgeLine"></div>

        <div id="keys">

            <div
                class="key red"
                data-key="a">
                A
            </div>

            <div
                class="key yellow"
                data-key="s">
                S
            </div>

            <div
                class="key blue"
                data-key="d">
                D
            </div>

        </div>

    </div>


    <div id="judgeText"></div>

</div>


<!-- =========================
     시작
========================= -->

<div id="startOverlay">
    START
</div>


<!-- =========================
     결과
========================= -->

<div id="result" class="screen">

    <div id="resultTitle">
        CLEAR!
    </div>

    <div class="resultBox">

        <div class="resultRow">
            <span>곡</span>
            <strong id="resultSong">-</strong>
        </div>

        <div class="resultRow">
            <span>성공</span>
            <strong id="resultHits">0</strong>
        </div>

        <div class="resultRow">
            <span>MISS</span>
            <strong id="resultMisses">0</strong>
        </div>

        <div class="resultRow">
            <span>정확도</span>
            <strong id="resultAccuracy">0%</strong>
        </div>

    </div>


    <div class="resultButtons">

        <button
            class="resultButton"
            onclick="retrySong()">
            다시 도전
        </button>

        <button
            class="resultButton"
            onclick="goMenu()">
            곡 선택
        </button>

    </div>

</div>


<script>

/* =========================================================
   곡
========================================================= */

const songs = {

    loveAttack: {
        title: "LOVE ATTACK",
        artist: "RESCENE",
        file: "music/love_attack.mp3"
    },

    lemonade: {
        title: "LEMONADE",
        artist: "aespa",
        file: "music/lemonade.mp3"
    },

    blueValentine: {
        title: "Blue Valentine",
        artist: "NMIXX",
        file: "music/blue_valentine.mp3"
    }

};


/* =========================================================
   변수
========================================================= */

let selectedSong = null;

let audio = null;

let audioContext = null;

let analyser = null;

let sourceNode = null;

let gameRunning = false;

let animationFrame = null;

let activeNotes = [];

let hitCount = 0;

let missCount = 0;

let previousEnergy = 0;

let lastBeatTime = -10;

let endedHandled = false;


/* =========================================================
   게임 설정
========================================================= */

/*
   원이 위에서 판정선까지
   이동하는 시간.
*/

const NOTE_TRAVEL_TIME = 1.35;


/*
   PERFECT 판정 범위
*/

const PERFECT_WINDOW = 0.075;


/*
   GOOD 판정 범위
*/

const GOOD_WINDOW = 0.17;


/*
   원 생성 최소 간격.

   숫자를 줄이면 원이 많아짐.
*/

const MIN_BEAT_INTERVAL = 0.20;


/*
   클리어 기준.

   90% 이상 맞추면 CLEAR.
*/

const CLEAR_RATE = 0.90;


/* =========================================================
   화면
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================================================
   곡 시작
========================================================= */

async function startSong(songKey) {

    selectedSong = songKey;

    const song = songs[songKey];


    /*
       기존 게임 정리
    */

    stopGame();


    /*
       화면
    */

    showScreen("game");


    document.getElementById(
        "songTitle"
    ).textContent =
        song.title +
        " · " +
        song.artist;


    /*
       새로운 Audio 객체
    */

    audio = new Audio();

    audio.src = song.file;

    audio.preload = "auto";

    /*
       같은 GitHub Pages에서
       가져오기 때문에 crossOrigin은
       사용하지 않는다.
    */


    /*
       끝났을 때
    */

    audio.addEventListener(
        "ended",
        finishGame
    );


    /*
       게임 초기화
    */

    hitCount = 0;

    missCount = 0;

    activeNotes = [];

    previousEnergy = 0;

    lastBeatTime = -10;

    endedHandled = false;

    gameRunning = true;


    updateStatus();


    /*
       사용자가 곡 버튼을 누른 직후이므로
       여기서 AudioContext를 만든다.

       iPad Safari의 자동재생 제한을
       피하기 위한 핵심 부분.
    */

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        /*
           오디오 컨텍스트가 멈춰 있다면
           바로 깨운다.
        */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        /*
           새로운 audio element에
           analyser 연결
        */

        sourceNode =
            audioContext
                .createMediaElementSource(
                    audio
                );


        analyser =
            audioContext
                .createAnalyser();


        analyser.fftSize =
            1024;


        analyser.smoothingTimeConstant =
            0.55;


        sourceNode.connect(
            analyser
        );


        analyser.connect(
            audioContext.destination
        );


        /*
           음악 재생
        */

        await audio.play();


        /*
           START 표시
        */

        showStart();


        /*
           게임 시작
        */

        requestAnimationFrame(
            gameLoop
        );


    } catch(error) {

        console.error(
            "AUDIO ERROR:",
            error
        );


        /*
           AudioContext 분석이 실패해도
           음악 자체는 재생을 시도한다.
        */

        try {

            await audio.play();

            showStart();

            requestAnimationFrame(
                gameLoop
            );

        } catch(playError) {

            console.error(
                playError
            );

            alert(
                "음악 재생에 실패했습니다.\n\n" +
                "MP3 파일은 정상적으로 존재하므로 " +
                "브라우저 오디오 설정을 확인해주세요."
            );

            goMenu();

        }

    }

}


/* =========================================================
   START
========================================================= */

function showStart() {

    const overlay =
        document.getElementById(
            "startOverlay"
        );


    overlay.classList.add(
        "show"
    );


    setTimeout(
        () => {

            overlay.classList.remove(
                "show"
            );

        },
        600
    );

}


/* =========================================================
   음악 분석
========================================================= */

function analyseMusic() {

    if (!analyser) {
        return null;
    }


    const length =
        analyser.frequencyBinCount;


    const data =
        new Uint8Array(
            length
        );


    analyser.getByteFrequencyData(
        data
    );


    /*
       저음 / 중음 / 고음
    */

    let low = 0;

    let mid = 0;

    let high = 0;


    const lowEnd =
        Math.floor(
            length * 0.12
        );


    const midEnd =
        Math.floor(
            length * 0.45
        );


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (i < lowEnd) {

            low += data[i];

        }
        else if (
            i < midEnd
        ) {

            mid += data[i];

        }
        else {

            high += data[i];

        }

    }


    low /=
        Math.max(
            lowEnd,
            1
        );


    mid /=
        Math.max(
            midEnd - lowEnd,
            1
        );


    high /=
        Math.max(
            length - midEnd,
            1
        );


    /*
       전체 에너지
    */

    const energy =
        low * 0.50 +
        mid * 0.32 +
        high * 0.18;


    return {
        low,
        mid,
        high,
        energy
    };

}


/* =========================================================
   색 결정
========================================================= */

function chooseColor(data) {

    if (
        data.low >= data.mid &&
        data.low >= data.high
    ) {

        return "red";

    }


    if (
        data.mid >= data.low &&
        data.mid >= data.high
    ) {

        return "yellow";

    }


    return "blue";

}


/* =========================================================
   비트 감지
========================================================= */

function detectBeat(
    data,
    currentTime
) {

    if (!data) {
        return false;
    }


    /*
       현재 에너지
    */

    const currentEnergy =
        data.energy;


    /*
       이전 에너지와 비교
    */

    const difference =
        currentEnergy -
        previousEnergy;


    /*
       천천히 기준 에너지 갱신
    */

    previousEnergy =
        previousEnergy * 0.88 +
        currentEnergy * 0.12;


    /*
       너무 조용하면 무시
    */

    if (
        currentEnergy < 18
    ) {

        return false;

    }


    /*
       순간적인 에너지 상승.

       낮을수록 노트가 많아진다.
    */

    const threshold = 5.5;


    if (
        difference < threshold
    ) {

        return false;

    }


    /*
       너무 빠른 연속 생성 방지
    */

    if (
        currentTime -
        lastBeatTime <
        MIN_BEAT_INTERVAL
    ) {

        return false;

    }


    lastBeatTime =
        currentTime;


    return true;

}


/* =========================================================
   메인 게임 루프
========================================================= */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    if (
        !audio ||
        audio.paused
    ) {

        animationFrame =
            requestAnimationFrame(
                gameLoop
            );

        return;

    }


    const currentTime =
        audio.currentTime;


    /*
       음악 분석
    */

    const music =
        analyseMusic();


    /*
       비트 발견
    */

    if (
        music &&
        detectBeat(
            music,
            currentTime
        )
    ) {

        const color =
            chooseColor(
                music
            );


        /*
           ⭐ 중요

           원이 지금 생성되지만
           판정선에는 1.35초 후 도착해야 한다.

           그래서 hitTime을
           현재시간 + 이동시간으로 한다.
        */

        const hitTime =
            currentTime +
            NOTE_TRAVEL_TIME;


        createNote(
            color,
            hitTime
        );

    }


    /*
       원 이동
    */

    updateNotes(
        currentTime
    );


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   원 생성
========================================================= */

function createNote(
    color,
    hitTime
) {

    const playArea =
        document.getElementById(
            "playArea"
        );


    const note =
        document.createElement(
            "div"
        );


    note.className =
        "note " +
        color;


    /*
       색 → 레인
    */

    let lane = 0;


    if (
        color === "red"
    ) {

        lane = 0;

    }
    else if (
        color === "yellow"
    ) {

        lane = 1;

    }
    else {

        lane = 2;

    }


    /*
       X 좌표
    */

    const laneWidth =
        playArea.clientWidth /
        3;


    const x =
        laneWidth * lane +
        laneWidth / 2;


    note.style.left =
        x + "px";


    /*
       위에서 시작
    */

    note.style.top =
        "-70px";


    /*
       데이터
    */

    note.dataset.color =
        color;

    note.dataset.lane =
        lane;

    note.dataset.hitTime =
        hitTime;

    note.dataset.hit =
        "false";


    playArea.appendChild(
        note
    );


    activeNotes.push(
        note
    );

}


/* =========================================================
   원 이동
========================================================= */

function updateNotes(
    currentTime
) {

    const playArea =
        document.getElementById(
            "playArea"
        );


    const judgeLine =
        document.getElementById(
            "judgeLine"
        );


    const startY =
        -70;


    const endY =
        judgeLine.offsetTop -
        27;


    for (
        let i =
            activeNotes.length - 1;
        i >= 0;
        i--
    ) {

        const note =
            activeNotes[i];


        if (
            note.dataset.hit ===
            "true"
        ) {

            continue;

        }


        const hitTime =
            Number(
                note.dataset.hitTime
            );


        /*
           판정까지 남은 시간
        */

        const remaining =
            hitTime -
            currentTime;


        /*
           이동 진행도

           0 = 위
           1 = 판정선
        */

        const progress =
            1 -
            (
                remaining /
                NOTE_TRAVEL_TIME
            );


        const y =
            startY +
            (
                endY -
                startY
            ) *
            progress;


        note.style.top =
            y + "px";


        /*
           판정 시간을 지나면 MISS
        */

        if (
            currentTime -
            hitTime >
            GOOD_WINDOW
        ) {

            missNote(
                note
            );

            activeNotes.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   키보드
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key !== "a" &&
            key !== "s" &&
            key !== "d"
        ) {

            return;

        }


        if (!gameRunning) {
            return;
        }


        pressKey(
            key
        );


        event.preventDefault();

    }
);


/* =========================================================
   화면 버튼
========================================================= */

document
    .querySelectorAll(".key")
    .forEach(
        button => {

            button.addEventListener(
                "pointerdown",
                event => {

                    if (
                        !gameRunning
                    ) {

                        return;

                    }


                    pressKey(
                        button.dataset.key
                    );


                    event.preventDefault();

                }
            );

        }
    );


/* =========================================================
   키 입력
========================================================= */

function pressKey(key) {

    let lane;


    if (
        key === "a"
    ) {

        lane = 0;

    }
    else if (
        key === "s"
    ) {

        lane = 1;

    }
    else {

        lane = 2;

    }


    /*
       버튼 효과
    */

    const button =
        document.querySelector(
            `.key[data-key="${key}"]`
        );


    if (button) {

        button.classList.add(
            "pressed"
        );


        setTimeout(
            () => {

                button.classList.remove(
                    "pressed"
                );

            },
            70
        );

    }


    if (!audio) {
        return;
    }


    const currentTime =
        audio.currentTime;


    let target = null;

    let bestDifference =
        Infinity;


    /*
       가장 가까운 원 찾기
    */

    for (
        const note of activeNotes
    ) {

        if (
            note.dataset.hit ===
            "true"
        ) {

            continue;

        }


        if (
            Number(
                note.dataset.lane
            ) !== lane
        ) {

            continue;

        }


        const difference =
            Math.abs(
                currentTime -
                Number(
                    note.dataset.hitTime
                )
            );


        if (
            difference <
            bestDifference
        ) {

            bestDifference =
                difference;

            target =
                note;

        }

    }


    /*
       판정
    */

    if (
        target &&
        bestDifference <=
        GOOD_WINDOW
    ) {

        if (
            bestDifference <=
            PERFECT_WINDOW
        ) {

            hitNote(
                target,
                "PERFECT"
            );

        }
        else {

            hitNote(
                target,
                "GOOD"
            );

        }

    }

}


/* =========================================================
   성공
========================================================= */

function hitNote(
    note,
    result
) {

    if (
        note.dataset.hit ===
        "true"
    ) {

        return;

    }


    note.dataset.hit =
        "true";


    hitCount++;


    showJudge(
        result,
        result === "PERFECT"
            ? "perfect"
            : "good"
    );


    updateStatus();


    note.remove();


    const index =
        activeNotes.indexOf(
            note
        );


    if (
        index !== -1
    ) {

        activeNotes.splice(
            index,
            1
        );

    }

}


/* =========================================================
   MISS
========================================================= */

function missNote(
    note
) {

    if (
        note.dataset.hit ===
        "true"
    ) {

        return;

    }


    note.dataset.hit =
        "true";


    missCount++;


    showJudge(
        "MISS",
        "miss"
    );


    updateStatus();


    note.remove();

}


/* =========================================================
   판정 표시
========================================================= */

function showJudge(
    text,
    type
) {

    const judge =
        document.getElementById(
            "judgeText"
        );


    judge.className = "";

    judge.textContent =
        text;


    void judge.offsetWidth;


    judge.classList.add(
        "show",
        type
    );

}


/* =========================================================
   상태
========================================================= */

function updateStatus() {

    document.getElementById(
        "gameStatus"
    ).textContent =
        "성공 " +
        hitCount +
        " · MISS " +
        missCount;

}


/* =========================================================
   게임 종료
========================================================= */

function finishGame() {

    if (
        endedHandled
    ) {

        return;

    }


    endedHandled = true;

    gameRunning = false;


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }


    if (audio) {

        audio.pause();

    }


    /*
       남은 원 제거
    */

    activeNotes.forEach(
        note => {

            note.remove();

        }
    );


    activeNotes = [];


    /*
       정확도
    */

    const total =
        hitCount +
        missCount;


    let accuracy = 0;


    if (
        total > 0
    ) {

        accuracy =
            hitCount /
            total;

    }


    const percentage =
        Math.round(
            accuracy * 100
        );


    const clear =
        accuracy >=
        CLEAR_RATE;


    /*
       결과
    */

    const title =
        document.getElementById(
            "resultTitle"
        );


    title.textContent =
        clear
            ? "CLEAR!"
            : "FAILED";


    title.className =
        clear
            ? "clear"
            : "failed";


    document.getElementById(
        "resultSong"
    ).textContent =
        songs[
            selectedSong
        ].title;


    document.getElementById(
        "resultHits"
    ).textContent =
        hitCount;


    document.getElementById(
        "resultMisses"
    ).textContent =
        missCount;


    document.getElementById(
        "resultAccuracy"
    ).textContent =
        percentage +
        "%";


    showScreen(
        "result"
    );

}


/* =========================================================
   다시하기
========================================================= */

function retrySong() {

    startSong(
        selectedSong
    );

}


/* =========================================================
   메뉴
========================================================= */

function goMenu() {

    stopGame();

    showScreen(
        "menu"
    );

}


/* =========================================================
   정지
========================================================= */

function stopGame() {

    gameRunning = false;


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }


    if (audio) {

        audio.pause();

        audio.currentTime = 0;

    }


    activeNotes.forEach(
        note => {

            note.remove();

        }
    );


    activeNotes = [];

}


/* =========================================================
   초기 화면
========================================================= */

showScreen(
    "menu"
);

</script>

</body>
</html>

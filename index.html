<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLOR BEAT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050509;
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   공통 화면
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}

/* =========================
   곡 선택 화면
========================= */

#menu {
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 20%,
            #29293a,
            #0c0c14 50%,
            #030305
        );
}

.menuBox {
    width: min(90vw, 560px);
    text-align: center;
}

.logo {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 6px;
}

.subtitle {
    margin-top: 10px;
    color: #777;
    letter-spacing: 3px;
}

.songList {
    margin-top: 45px;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.songButton {
    width: 100%;
    padding: 20px;

    border: 1px solid #30303c;
    border-radius: 14px;

    background: #12121b;
    color: white;

    text-align: left;

    transition: .15s;
}

.songButton:hover {
    transform: translateY(-2px);
    background: #1d1d28;
}

.songButton small {
    color: #666;
}

.songButton strong {
    display: block;
    margin-top: 5px;
    font-size: 22px;
}

.songButton span {
    display: block;
    margin-top: 5px;
    color: #777;
}

.menuHelp {
    margin-top: 25px;
    color: #555;
    font-size: 13px;
}

/* =========================
   게임
========================= */

#game {
    justify-content: center;
}

.gameContainer {
    position: relative;

    width: min(100vw, 720px);
    height: 100vh;

    overflow: hidden;

    background: #08080d;
}

/* =========================
   상단
========================= */

.topBar {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 65px;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(5,5,9,.97);

    border-bottom: 1px solid #292932;
}

.back {
    position: absolute;
    left: 12px;

    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 10px;

    background: #191921;
    color: white;

    font-size: 22px;
}

.songInfo {
    text-align: center;
}

.songInfo strong {
    display: block;
    font-size: 16px;
}

.songInfo span {
    display: block;
    margin-top: 4px;
    color: #777;
    font-size: 11px;
}

.scoreBox {
    position: absolute;
    right: 15px;
    text-align: right;
}

.scoreBox small {
    color: #666;
}

.scoreBox strong {
    display: block;
    margin-top: 2px;
    font-size: 20px;
}

/* =========================
   플레이 영역
========================= */

.playArea {
    position: absolute;

    top: 65px;
    bottom: 125px;

    left: 0;
    right: 0;

    overflow: hidden;

    background: #08080d;
}

/* =========================
   피아노 타일 배경
========================= */

.lanes {
    position: absolute;
    inset: 0;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
}

.lane {
    position: relative;

    border-left: 1px solid rgba(255,255,255,.08);
    border-right: 1px solid rgba(255,255,255,.02);

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 2px,
            transparent 2px,
            transparent 80px
        );
}

.lane::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    top: 0;
    bottom: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,.8) 0px,
            rgba(0,0,0,.8) 39px,
            rgba(255,255,255,.04) 39px,
            rgba(255,255,255,.04) 43px,
            rgba(0,0,0,.8) 43px,
            rgba(0,0,0,.8) 80px
        );
}

.lane:nth-child(1) {
    box-shadow: inset 0 0 40px rgba(255,50,60,.05);
}

.lane:nth-child(2) {
    box-shadow: inset 0 0 40px rgba(255,220,30,.05);
}

.lane:nth-child(3) {
    box-shadow: inset 0 0 40px rgba(40,120,255,.05);
}

.lane:nth-child(4) {
    box-shadow: inset 0 0 40px rgba(190,70,255,.05);
}

/* =========================
   노트 영역
========================= */

.noteLayer {
    position: absolute;
    inset: 0;
    z-index: 20;
}

/* =========================
   일반 음표
========================= */

.normalNote {
    position: absolute;

    width: 42px;
    height: 52px;

    transform: translateX(-50%);

    z-index: 30;
}

.normalNote::before {
    content: "♪";

    position: absolute;

    left: 0;
    top: 0;

    font-size: 48px;
    font-weight: bold;

    line-height: 1;

    filter: drop-shadow(0 0 8px currentColor);
}

.normalNote.lane0 {
    color: #ff3c4b;
}

.normalNote.lane1 {
    color: #ffe32e;
}

.normalNote.lane2 {
    color: #3c8cff;
}

.normalNote.lane3 {
    color: #bf5cff;
}

/* =========================
   롱노트
========================= */

.longNote {
    position: absolute;

    width: 25px;

    transform: translateX(-50%);

    border-radius: 10px;

    z-index: 25;
}

.longNote::before {
    content: "";

    position: absolute;

    left: 50%;
    top: -7px;

    width: 35px;
    height: 18px;

    transform: translateX(-50%);

    border-radius: 50%;
}

.longNote.lane0 {
    background: #ff3c4b;
    box-shadow: 0 0 15px #ff3c4b;
}

.longNote.lane0::before {
    background: #ff3c4b;
}

.longNote.lane1 {
    background: #ffe32e;
    box-shadow: 0 0 15px #ffe32e;
}

.longNote.lane1::before {
    background: #ffe32e;
}

.longNote.lane2 {
    background: #3c8cff;
    box-shadow: 0 0 15px #3c8cff;
}

.longNote.lane2::before {
    background: #3c8cff;
}

.longNote.lane3 {
    background: #bf5cff;
    box-shadow: 0 0 15px #bf5cff;
}

.longNote.lane3::before {
    background: #bf5cff;
}

.longNote.holding {
    filter: brightness(1.5);
}

/* =========================
   판정선
========================= */

.judgeLine {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 30px;

    height: 4px;

    z-index: 50;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,.7);
}

/* =========================
   HIT / MISS
========================= */

.judgeText {
    position: absolute;

    left: 50%;
    top: 38%;

    transform: translate(-50%, -50%);

    z-index: 90;

    opacity: 0;

    font-size: 34px;
    font-weight: 900;

    pointer-events: none;
}

.judgeText.show {
    animation: judge .35s ease-out;
}

.judgeText.hit {
    color: white;
}

.judgeText.miss {
    color: #ff2525;
    text-shadow:
        0 0 10px red,
        0 0 25px red;
}

@keyframes judge {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.7);
    }

    25% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* =========================
   카운트다운
========================= */

.countdown {
    position: absolute;

    left: 50%;
    top: 42%;

    transform: translate(-50%, -50%);

    z-index: 120;

    font-size: 80px;
    font-weight: 900;

    text-shadow:
        0 0 20px white;
}

/* =========================
   ASDF 버튼
========================= */

.keyArea {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 125px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    z-index: 100;

    background: #07070c;
}

.key {
    position: relative;

    border: 0;
    border-top: 3px solid;

    background: #111119;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 900;

    transition: .05s;
}

.key:nth-child(1) {
    border-color: #ff3c4b;
}

.key:nth-child(2) {
    border-color: #ffe32e;
}

.key:nth-child(3) {
    border-color: #3c8cff;
}

.key:nth-child(4) {
    border-color: #bf5cff;
}

.key.active:nth-child(1) {
    background: rgba(255,60,75,.35);
}

.key.active:nth-child(2) {
    background: rgba(255,227,46,.3);
}

.key.active:nth-child(3) {
    background: rgba(60,140,255,.3);
}

.key.active:nth-child(4) {
    background: rgba(191,92,255,.3);
}

.key.active {
    transform: scale(.96);
}

/* =========================
   시작 화면
========================= */

.startOverlay {
    position: absolute;
    inset: 0;

    z-index: 200;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(4,4,8,.96);
}

.startOverlay h2 {
    font-size: 46px;
}

.startOverlay p {
    margin-top: 8px;
    color: #777;
}

.startButton {
    margin-top: 25px;

    padding: 15px 60px;

    border: 0;
    border-radius: 12px;

    background: white;
    color: black;

    font-weight: bold;
}

/* =========================
   결과
========================= */

#result {
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 25%,
            #303040,
            #07070c 70%
        );
}

.resultBox {
    width: min(90vw, 520px);
    text-align: center;
}

.resultBox small {
    color: #777;
    letter-spacing: 4px;
}

.resultBox h1 {
    margin-top: 8px;
    font-size: 70px;
}

.resultSong {
    margin-top: 10px;
    color: #777;
}

.finalScore {
    margin-top: 30px;
    font-size: 68px;
    font-weight: 900;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 25px;
}

.stat {
    padding: 18px;

    border-radius: 12px;

    background: #15151d;
}

.stat span {
    display: block;
    color: #777;
}

.stat strong {
    display: block;
    margin-top: 6px;
    font-size: 24px;
}

.reward {
    margin-top: 18px;
    padding: 18px;

    border: 1px solid #30303a;
    border-radius: 13px;

    background: #15151d;
}

.reward p {
    margin-top: 6px;
    color: #777;
}

.resultButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 18px;
}

.resultButtons button {
    padding: 15px;

    border: 0;
    border-radius: 10px;

    background: #24242d;
    color: white;
}

.resultButtons button:first-child {
    background: white;
    color: black;
}

/* =========================
   모바일
========================= */

@media(max-width:600px) {

    .logo {
        font-size: 42px;
    }

    .topBar {
        height: 58px;
    }

    .playArea {
        top: 58px;
        bottom: 110px;
    }

    .keyArea {
        height: 110px;
    }

    .normalNote {
        transform: translateX(-50%) scale(.85);
    }

    .finalScore {
        font-size: 56px;
    }
}
</style>
</head>

<body>

<!-- ==================================================
     곡 선택
================================================== -->

<section id="menu" class="screen active">

    <div class="menuBox">

        <div class="logo">
            COLOR BEAT
        </div>

        <div class="subtitle">
            RHYTHM GAME
        </div>

        <div class="songList">

            <button
                class="songButton"
                data-song="lemonade"
            >
                <small>SONG 01</small>
                <strong>LEMONADE</strong>
                <span>aespa</span>
            </button>

            <button
                class="songButton"
                data-song="loveAttack"
            >
                <small>SONG 02</small>
                <strong>LOVE ATTACK</strong>
                <span>RESCENE</span>
            </button>

            <button
                class="songButton"
                data-song="blueValentine"
            >
                <small>SONG 03</small>
                <strong>BLUE VALENTINE</strong>
                <span>NMIXX</span>
            </button>

        </div>

        <div class="menuHelp">
            A · S · D · F
        </div>

    </div>

</section>


<!-- ==================================================
     게임
================================================== -->

<section id="game" class="screen">

    <div class="gameContainer">

        <div class="topBar">

            <button
                class="back"
                id="backButton"
            >
                ←
            </button>

            <div class="songInfo">
                <strong id="songTitle">
                    LEMONADE
                </strong>

                <span id="songArtist">
                    aespa
                </span>
            </div>

            <div class="scoreBox">
                <small>SCORE</small>
                <strong id="score">
                    0
                </strong>
            </div>

        </div>


        <div class="playArea">

            <div class="lanes">

                <div class="lane"></div>
                <div class="lane"></div>
                <div class="lane"></div>
                <div class="lane"></div>

            </div>

            <div
                class="noteLayer"
                id="noteLayer"
            ></div>

            <div class="judgeLine"></div>

            <div
                class="judgeText"
                id="judgeText"
            ></div>

            <div
                class="countdown"
                id="countdown"
            ></div>

        </div>


        <div class="keyArea">

            <button
                class="key"
                data-lane="0"
            >
                A
            </button>

            <button
                class="key"
                data-lane="1"
            >
                S
            </button>

            <button
                class="key"
                data-lane="2"
            >
                D
            </button>

            <button
                class="key"
                data-lane="3"
            >
                F
            </button>

        </div>


        <div
            class="startOverlay"
            id="startOverlay"
        >

            <h2 id="startSong">
                LEMONADE
            </h2>

            <p id="startArtist">
                aespa
            </p>

            <button
                class="startButton"
                id="startButton"
            >
                START
            </button>

        </div>


        <audio
            id="audio"
            preload="auto"
        ></audio>

    </div>

</section>


<!-- ==================================================
     결과
================================================== -->

<section id="result" class="screen">

    <div class="resultBox">

        <small>RESULT</small>

        <h1 id="resultTitle">
            FAILED
        </h1>

        <div
            class="resultSong"
            id="resultSong"
        ></div>

        <div
            class="finalScore"
            id="finalScore"
        >
            0 / 100
        </div>

        <div class="stats">

            <div class="stat">
                <span>HIT</span>
                <strong id="hitCount">0</strong>
            </div>

            <div class="stat">
                <span>MISS</span>
                <strong id="missCount">0</strong>
            </div>

        </div>

        <div class="reward">

            <strong id="rewardTitle">
                NO REWARD
            </strong>

            <p id="rewardText">
                100점을 만들어야 클리어입니다.
            </p>

        </div>

        <div class="resultButtons">

            <button id="retryButton">
                다시 하기
            </button>

            <button id="menuButton">
                곡 선택
            </button>

        </div>

    </div>

</section>


<script>

/* ==================================================
   곡 정보
================================================== */

const SONGS = {

    lemonade: {
        title: "LEMONADE",
        artist: "aespa",

        /*
         * 네가 올린 파일
         */
        file: "./music/lemonade.mp3",

        bpm: 129.2,

        /*
         * 노트 시작 위치 보정
         */
        offset: 0.20,

        duration: 187
    },

    loveAttack: {
        title: "LOVE ATTACK",
        artist: "RESCENE",

        /*
         * 실제 파일명이 다르면
         * 이 부분만 수정
         */
        file: "./music/love_attack.mp3",

        bpm: 112,

        offset: 0.20,

        duration: 180
    },

    blueValentine: {
        title: "BLUE VALENTINE",
        artist: "NMIXX",

        /*
         * 실제 파일명이 다르면
         * 이 부분만 수정
         */
        file: "./music/blue_valentine.mp3",

        bpm: 161,

        offset: 0.20,

        duration: 186
    }

};


/* ==================================================
   DOM
================================================== */

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const result =
    document.getElementById("result");

const audio =
    document.getElementById("audio");

const noteLayer =
    document.getElementById("noteLayer");

const scoreElement =
    document.getElementById("score");

const judgeText =
    document.getElementById("judgeText");

const countdown =
    document.getElementById("countdown");

const startOverlay =
    document.getElementById("startOverlay");


/* ==================================================
   게임 변수
================================================== */

let currentSong = null;

let chart = [];

let chartIndex = 0;

let activeNotes = [];

let running = false;

let animationFrame = null;

let hitCount = 0;

let missCount = 0;

let totalNotes = 0;

let heldKeys = new Set();


/*
 * 판정 범위
 *
 * 기존보다 좁게 설정
 */
const HIT_WINDOW = 0.09;


/*
 * 노트가 화면 위에서부터
 * 판정선까지 내려오는 기본 시간
 */
const BASE_TRAVEL = 1.55;


/* ==================================================
   곡 선택
================================================== */

document
.querySelectorAll(".songButton")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const id =
                button.dataset.song;

            currentSong =
                SONGS[id];

            openGame();

        }
    );

});


/* ==================================================
   게임 열기
================================================== */

function openGame() {

    menu.classList.remove("active");

    result.classList.remove("active");

    game.classList.add("active");


    document.getElementById(
        "songTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "songArtist"
    ).textContent =
        currentSong.artist;


    document.getElementById(
        "startSong"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "startArtist"
    ).textContent =
        currentSong.artist;


    resetGame();

}


/* ==================================================
   초기화
================================================== */

function resetGame() {

    stopGame();


    hitCount = 0;

    missCount = 0;

    chartIndex = 0;

    activeNotes = [];

    noteLayer.innerHTML = "";

    scoreElement.textContent = "0";


    /*
     * 곡의 실제 박자에 맞춰
     * 차트 생성
     */
    chart =
        generateChart(
            currentSong
        );


    totalNotes =
        chart.length;


    /*
     * 음악 파일 설정
     */
    audio.src =
        currentSong.file;

    audio.load();

}


/* ==================================================
   차트 생성
================================================== */

function generateChart(song) {

    const result = [];

    const beat =
        60 / song.bpm;


    let time =
        song.offset + 1.0;


    let count = 0;

    let previousLane = -1;


    while (
        time <
        song.duration - 1.5
    ) {

        const progress =
            time /
            song.duration;


        /*
         * 초반
         */
        let probability =
            0.62;


        /*
         * 중반부터 증가
         */
        if(progress > 0.20)
            probability = 0.72;

        if(progress > 0.40)
            probability = 0.82;

        if(progress > 0.60)
            probability = 0.92;

        if(progress > 0.80)
            probability = 1.0;


        /*
         * 랜덤 레인
         */
        let lane =
            Math.floor(
                Math.random() * 4
            );


        /*
         * 같은 레인 반복 방지
         */
        if(
            lane ===
            previousLane
        ) {

            lane =
                (lane + 1) % 4;

        }


        /*
         * 노트 생성
         */
        if(
            Math.random() <
            probability
        ) {

            /*
             * 후반으로 갈수록
             * 롱노트 증가
             */
            let longProbability =
                0.06;


            if(progress > 0.35)
                longProbability = 0.10;

            if(progress > 0.55)
                longProbability = 0.15;

            if(progress > 0.75)
                longProbability = 0.20;


            const isLong =
                Math.random() <
                longProbability;


            let duration = 0;


            if(isLong) {

                duration =
                    0.45 +
                    Math.random() * 0.85;

            }


            result.push({

                id: count++,

                time: Number(
                    time.toFixed(3)
                ),

                lane: lane,

                type:
                    isLong
                    ? "long"
                    : "normal",

                duration:
                    duration

            });


            previousLane =
                lane;


            /*
             * 후반부에는
             * 반박자 추가 노트
             */
            if(
                progress > 0.55 &&
                Math.random() < 0.20
            ) {

                let secondLane =
                    Math.floor(
                        Math.random() * 4
                    );


                if(
                    secondLane ===
                    lane
                ) {

                    secondLane =
                        (secondLane + 1) % 4;

                }


                result.push({

                    id: count++,

                    time: Number(
                        (
                            time +
                            beat / 2
                        ).toFixed(3)
                    ),

                    lane:
                        secondLane,

                    type:
                        "normal",

                    duration:
                        0

                });

            }

        }


        /*
         * 후반부로 갈수록
         * 노트 사이 간격 감소
         */
        let interval =
            beat;


        if(progress > 0.25)
            interval = beat * 0.90;

        if(progress > 0.45)
            interval = beat * 0.80;

        if(progress > 0.65)
            interval = beat * 0.70;

        if(progress > 0.82)
            interval = beat * 0.60;


        time += interval;

    }


    /*
     * 시간순 정렬
     */
    result.sort(
        (a,b) =>
            a.time - b.time
    );


    return result;

}


/* ==================================================
   곡 진행에 따른 속도
================================================== */

function getTravelTime(noteTime) {

    const progress =
        noteTime /
        currentSong.duration;


    let travel =
        BASE_TRAVEL;


    /*
     * 초반
     */
    if(progress > 0.25)
        travel *= 0.92;


    /*
     * 중반
     */
    if(progress > 0.45)
        travel *= 0.83;


    /*
     * 후반
     */
    if(progress > 0.65)
        travel *= 0.72;


    /*
     * 마지막 구간
     */
    if(progress > 0.82)
        travel *= 0.62;


    return travel;

}


/* ==================================================
   START
================================================== */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);


async function startGame() {

    resetGame();

    startOverlay.style.display =
        "none";


    await countdownStart();


    try {

        audio.currentTime = 0;

        await audio.play();

    }

    catch(error) {

        console.error(error);

        alert(
            "음악을 재생할 수 없습니다.\n\n" +
            "music 폴더와 MP3 파일 이름을 확인해주세요."
        );


        startOverlay.style.display =
            "flex";

        return;

    }


    running = true;

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   카운트다운
================================================== */

function countdownStart() {

    return new Promise(resolve => {

        let number = 3;


        const run = () => {

            if(number > 0) {

                countdown.textContent =
                    number;

                number--;

                setTimeout(
                    run,
                    600
                );

            }

            else {

                countdown.textContent =
                    "START!";


                setTimeout(
                    () => {

                        countdown.textContent =
                            "";

                        resolve();

                    },
                    450
                );

            }

        };


        run();

    });

}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop() {

    if(!running)
        return;


    const time =
        audio.currentTime;


    spawnNotes(time);

    updateNotes(time);

    updateLongNotes(time);


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   노트 생성
================================================== */

function spawnNotes(time) {

    while(
        chartIndex <
        chart.length
    ) {

        const data =
            chart[chartIndex];


        const travel =
            getTravelTime(
                data.time
            );


        const spawnTime =
            data.time -
            travel;


        if(
            time <
            spawnTime
        ) {

            break;

        }


        createNote(data);

        chartIndex++;

    }

}


/* ==================================================
   노트 DOM 생성
================================================== */

function createNote(data) {

    const note =
        document.createElement("div");


    note.dataset.id =
        data.id;

    note.dataset.lane =
        data.lane;

    note.dataset.time =
        data.time;

    note.dataset.type =
        data.type;

    note.dataset.duration =
        data.duration;


    note.noteData =
        data;


    if(
        data.type ===
        "normal"
    ) {

        note.className =
            "normalNote lane" +
            data.lane;

    }

    else {

        note.className =
            "longNote lane" +
            data.lane;

    }


    const laneWidth =
        document.querySelector(
            ".playArea"
        ).clientWidth / 4;


    note.style.left =
        (
            laneWidth *
            data.lane +
            laneWidth / 2
        ) + "px";


    note.hit = false;

    note.holding = false;

    note.completed = false;


    noteLayer.appendChild(note);

    activeNotes.push(note);

}


/* ==================================================
   노트 위치 업데이트
================================================== */

function updateNotes(time) {

    const playArea =
        document.querySelector(
            ".playArea"
        );


    const judgeLine =
        document.querySelector(
            ".judgeLine"
        );


    const startY =
        -100;


    const judgeY =
        judgeLine.offsetTop -
        20;


    for(
        const note of activeNotes
    ) {

        if(note.hit)
            continue;


        const data =
            note.noteData;


        const travel =
            getTravelTime(
                data.time
            );


        const progress =
            (
                time -
                (
                    data.time -
                    travel
                )
            ) /
            travel;


        const y =
            startY +
            (
                judgeY -
                startY
            ) *
            progress;


        if(
            data.type ===
            "normal"
        ) {

            note.style.top =
                y + "px";

        }

        else {

            /*
             * 롱노트의 시작점
             */
            note.style.top =
                y + "px";


            /*
             * 롱노트 끝부분
             */
            const endTime =
                data.time +
                data.duration;


            const endTravel =
                getTravelTime(
                    data.time
                );


            const endProgress =
                (
                    time -
                    (
                        endTime -
                        endTravel
                    )
                ) /
                endTravel;


            const endY =
                startY +
                (
                    judgeY -
                    startY
                ) *
                endProgress;


            /*
             * 화면에서 보이는
             * 막대 길이
             */
            let height =
                endY - y;


            /*
             * 최소 길이
             */
            height =
                Math.max(
                    45,
                    height
                );


            note.style.height =
                height + "px";

        }


        /*
         * 판정선을 지나친 일반 노트
         */
        if(
            data.type ===
            "normal" &&
            time -
            data.time >
            HIT_WINDOW
        ) {

            makeMiss(note);

        }


        /*
         * 롱노트 시작점을
         * 지나쳤는데 누르지 않음
         */
        if(
            data.type ===
            "long" &&
            !note.holding &&
            time -
            data.time >
            HIT_WINDOW
        ) {

            makeMiss(note);

        }

    }

}


/* ==================================================
   롱노트 처리
================================================== */

function updateLongNotes(time) {

    for(
        const note of activeNotes
    ) {

        if(
            note.hit ||
            note.noteData.type !== "long"
        )
            continue;


        if(!note.holding)
            continue;


        const lane =
            note.noteData.lane;


        /*
         * 키를 떼면 실패
         */
        if(
            !heldKeys.has(lane)
        ) {

            makeMiss(note);

            continue;

        }


        /*
         * 끝까지 누르고 있으면 성공
         */
        const endTime =
            note.noteData.time +
            note.noteData.duration;


        if(
            time >=
            endTime
        ) {

            note.hit = true;

            note.completed = true;

            hitCount++;

            updateScore();

            removeNote(note);

        }

    }

}


/* ==================================================
   키 입력
================================================== */

const KEY_TO_LANE = {

    a: 0,
    s: 1,
    d: 2,
    f: 3

};


document.addEventListener(
    "keydown",
    event => {

        if(!running)
            return;


        const key =
            event.key.toLowerCase();


        if(
            !(key in KEY_TO_LANE)
        )
            return;


        event.preventDefault();


        const lane =
            KEY_TO_LANE[key];


        /*
         * 이미 누르고 있으면
         * 연타로 처리하지 않음
         */
        if(
            heldKeys.has(lane)
        )
            return;


        heldKeys.add(lane);


        pressVisual(lane);

        judgeLane(lane);

    }
);


/* ==================================================
   키 떼기
================================================== */

document.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            !(key in KEY_TO_LANE)
        )
            return;


        const lane =
            KEY_TO_LANE[key];


        heldKeys.delete(lane);

        releaseVisual(lane);

        releaseLongNote(lane);

    }
);


/* ==================================================
   레인 판정
================================================== */

function judgeLane(lane) {

    const now =
        audio.currentTime;


    let closest = null;

    let closestDistance =
        Infinity;


    for(
        const note of activeNotes
    ) {

        if(note.hit)
            continue;


        if(
            note.noteData.lane !==
            lane
        )
            continue;


        const distance =
            Math.abs(
                note.noteData.time -
                now
            );


        if(
            distance <
            closestDistance
        ) {

            closestDistance =
                distance;

            closest =
                note;

        }

    }


    /*
     * 음표가 없거나
     * 판정 범위 밖
     */
    if(
        !closest ||
        closestDistance >
        HIT_WINDOW
    ) {

        missCount++;

        updateScore();

        showJudge(
            "MISS",
            "miss"
        );

        return;

    }


    /*
     * 일반 음표
     */
    if(
        closest.noteData.type ===
        "normal"
    ) {

        closest.hit =
            true;

        hitCount++;

        updateScore();

        showJudge(
            "HIT",
            "hit"
        );

        removeNote(
            closest
        );

        return;

    }


    /*
     * 롱노트 시작
     */
    if(
        closest.noteData.type ===
        "long"
    ) {

        closest.holding =
            true;

        closest.classList.add(
            "holding"
        );

        showJudge(
            "HIT",
            "hit"
        );

    }

}


/* ==================================================
   롱노트 손 떼기
================================================== */

function releaseLongNote(lane) {

    for(
        const note of activeNotes
    ) {

        if(
            note.hit ||
            note.noteData.type !== "long"
        )
            continue;


        if(
            note.noteData.lane !==
            lane
        )
            continue;


        if(!note.holding)
            continue;


        /*
         * 아직 끝나지 않았는데
         * 손을 뗌
         */
        const endTime =
            note.noteData.time +
            note.noteData.duration;


        if(
            audio.currentTime <
            endTime
        ) {

            makeMiss(note);

        }

    }

}


/* ==================================================
   MISS
================================================== */

function makeMiss(note) {

    if(note.hit)
        return;


    note.hit = true;

    missCount++;

    updateScore();

    showJudge(
        "MISS",
        "miss"
    );

    removeNote(note);

}


/* ==================================================
   노트 제거
================================================== */

function removeNote(note) {

    const index =
        activeNotes.indexOf(note);


    if(index !== -1) {

        activeNotes.splice(
            index,
            1
        );

    }


    if(
        note.parentNode
    ) {

        note.parentNode.removeChild(
            note
        );

    }

}


/* ==================================================
   점수
================================================== */

function updateScore() {

    let score = 0;


    if(
        totalNotes > 0
    ) {

        score =
            Math.floor(
                (
                    hitCount /
                    totalNotes
                ) * 100
            );

    }


    scoreElement.textContent =
        score;

}


/* ==================================================
   키 시각 효과
================================================== */

function pressVisual(lane) {

    const key =
        document.querySelector(
            `.key[data-lane="${lane}"]`
        );


    if(key) {

        key.classList.add(
            "active"
        );

    }

}


function releaseVisual(lane) {

    const key =
        document.querySelector(
            `.key[data-lane="${lane}"]`
        );


    if(key) {

        key.classList.remove(
            "active"
        );

    }

}


/* ==================================================
   HIT / MISS 표시
================================================== */

function showJudge(
    text,
    type
) {

    judgeText.textContent =
        text;


    judgeText.className =
        "judgeText " +
        type;


    void judgeText.offsetWidth;


    judgeText.classList.add(
        "show"
    );

}


/* ==================================================
   음악 종료
================================================== */

audio.addEventListener(
    "ended",
    finishGame
);


function finishGame() {

    if(!running)
        return;


    running = false;


    if(animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    /*
     * 남은 음표는 모두 MISS
     */
    const remaining =
        [...activeNotes];


    for(
        const note of remaining
    ) {

        if(!note.hit) {

            note.hit = true;

            missCount++;

        }

    }


    activeNotes = [];

    noteLayer.innerHTML = "";


    updateScore();


    const finalScore =
        Math.floor(
            (
                hitCount /
                totalNotes
            ) * 100
        );


    showResult(
        finalScore
    );

}


/* ==================================================
   결과
================================================== */

function showResult(score) {

    game.classList.remove("active");

    result.classList.add("active");


    const clear =
        score === 100;


    const title =
        document.getElementById(
            "resultTitle"
        );


    title.textContent =
        clear
        ? "CLEAR"
        : "FAILED";


    title.style.color =
        clear
        ? "white"
        : "#ff2525";


    document.getElementById(
        "resultSong"
    ).textContent =
        currentSong.title +
        " · " +
        currentSong.artist;


    document.getElementById(
        "finalScore"
    ).textContent =
        score +
        " / 100";


    document.getElementById(
        "hitCount"
    ).textContent =
        hitCount;


    document.getElementById(
        "missCount"
    ).textContent =
        missCount;


    document.getElementById(
        "rewardTitle"
    ).textContent =
        clear
        ? "CLEAR REWARD"
        : "NO REWARD";


    document.getElementById(
        "rewardText"
    ).textContent =
        clear
        ? "모든 음표를 성공했습니다!"
        : "100점을 만들어야 클리어할 수 있습니다.";

}


/* ==================================================
   STOP
================================================== */

function stopGame() {

    running = false;


    if(animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    audio.pause();


    try {
        audio.currentTime = 0;
    }
    catch(e) {}


    heldKeys.clear();


    activeNotes = [];


    noteLayer.innerHTML = "";


    document
    .querySelectorAll(".key")
    .forEach(
        key =>
            key.classList.remove(
                "active"
            )
    );

}


/* ==================================================
   뒤로가기
================================================== */

document
.getElementById("backButton")
.addEventListener(
    "click",
    () => {

        stopGame();

        game.classList.remove(
            "active"
        );

        menu.classList.add(
            "active"
        );

    }
);


/* ==================================================
   다시하기
================================================== */

document
.getElementById("retryButton")
.addEventListener(
    "click",
    () => {

        result.classList.remove(
            "active"
        );

        game.classList.add(
            "active"
        );

        startOverlay.style.display =
            "flex";

        resetGame();

    }
);


/* ==================================================
   곡 선택으로
================================================== */

document
.getElementById("menuButton")
.addEventListener(
    "click",
    () => {

        stopGame();

        result.classList.remove(
            "active"
        );

        menu.classList.add(
            "active"
        );

    }
);

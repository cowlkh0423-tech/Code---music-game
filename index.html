<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>COLOR BEAT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

body {
    background: #08080d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button {
    font-family: inherit;
}

/* =========================
   공통
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
}

.screen.active {
    display: flex;
}

/* =========================
   곡 선택
========================= */

#menu {
    flex-direction: column;
    background:
        radial-gradient(circle at center, #17172a 0%, #08080d 65%);
}

.logo {
    font-size: clamp(42px, 8vw, 80px);
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 15px;
    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 30px rgba(100,100,255,.25);
}

.subtitle {
    color: #999;
    font-size: 16px;
    margin-bottom: 40px;
}

.song-list {
    width: min(90%, 600px);
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.song-button {
    position: relative;
    width: 100%;
    min-height: 82px;
    border: 1px solid #303040;
    border-radius: 16px;
    background: linear-gradient(135deg, #15151f, #101018);
    color: white;
    cursor: pointer;
    text-align: left;
    padding: 18px 24px;
    transition: .15s;
}

.song-button:hover {
    transform: scale(1.02);
    border-color: #777;
}

.song-button:active {
    transform: scale(.98);
}

.song-name {
    display: block;
    font-size: 22px;
    font-weight: bold;
}

.song-number {
    color: #777;
    font-size: 13px;
    margin-bottom: 5px;
}

.song-description {
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

/* =========================
   게임
========================= */

#game {
    background: #050509;
    flex-direction: column;
}

#gameTop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 65px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 25px;
    z-index: 100;
    background: rgba(5,5,9,.85);
    border-bottom: 1px solid #222;
}

.current-song {
    font-weight: bold;
    font-size: 17px;
}

.status {
    color: #aaa;
    font-size: 14px;
}

/* =========================
   리듬 영역
========================= */

#playArea {
    position: absolute;
    top: 65px;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(96vw, 650px);
    overflow: hidden;
    background:
        linear-gradient(
            90deg,
            rgba(255,0,0,.035) 0%,
            rgba(255,0,0,.035) 33.33%,
            rgba(255,220,0,.035) 33.33%,
            rgba(255,220,0,.035) 66.66%,
            rgba(0,130,255,.035) 66.66%,
            rgba(0,130,255,.035) 100%
        );
    border-left: 1px solid #202027;
    border-right: 1px solid #202027;
}

/* 레인 */

.lane {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 33.333%;
    border-right: 1px solid rgba(255,255,255,.06);
}

.lane:nth-child(1) {
    left: 0;
}

.lane:nth-child(2) {
    left: 33.333%;
}

.lane:nth-child(3) {
    left: 66.666%;
    border-right: none;
}

/* 판정선 */

#judgeLine {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 125px;
    height: 5px;
    background: rgba(255,255,255,.9);
    box-shadow: 0 0 15px rgba(255,255,255,.4);
    z-index: 20;
}

#keyLabels {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    height: 75px;
    display: flex;
    z-index: 30;
}

.key {
    width: 33.333%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    margin: 4px;
    font-size: 28px;
    font-weight: bold;
    background: rgba(255,255,255,.04);
    transition: .06s;
}

.key.red {
    color: #ff4d5a;
}

.key.yellow {
    color: #ffe04b;
}

.key.blue {
    color: #4d9cff;
}

.key.pressed {
    transform: scale(.94);
    background: rgba(255,255,255,.2);
}

/* =========================
   노트
========================= */

.note {
    position: absolute;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    transform: translateX(-50%);
    z-index: 10;
    box-shadow:
        0 0 12px currentColor,
        0 0 25px currentColor;
}

.note.red {
    background: #ff3948;
    color: #ff3948;
}

.note.yellow {
    background: #ffd92f;
    color: #ffd92f;
}

.note.blue {
    background: #368dff;
    color: #368dff;
}

/* =========================
   판정
========================= */

#judgeText {
    position: fixed;
    left: 50%;
    bottom: 210px;
    transform: translateX(-50%);
    z-index: 200;
    font-size: 32px;
    font-weight: 900;
    opacity: 0;
    pointer-events: none;
}

#judgeText.show {
    animation: judge .35s ease-out;
}

@keyframes judge {
    0% {
        opacity: 1;
        transform: translate(-50%, 10px) scale(.8);
    }

    30% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -25px) scale(1.05);
    }
}

.perfect {
    color: #fff;
}

.good {
    color: #ffe05b;
}

.miss {
    color: #ff5252;
}

/* =========================
   시작 카운트
========================= */

#countdown {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    background: rgba(0,0,0,.65);
    font-size: 100px;
    font-weight: 900;
}

#countdown.show {
    display: flex;
}

/* =========================
   결과
========================= */

#result {
    flex-direction: column;
    background:
        radial-gradient(circle at center, #18182a 0%, #08080d 70%);
}

.result-title {
    font-size: 60px;
    font-weight: 900;
    margin-bottom: 25px;
}

.result-title.clear {
    color: #5cff8d;
    text-shadow: 0 0 25px rgba(92,255,141,.4);
}

.result-title.failed {
    color: #ff5555;
    text-shadow: 0 0 25px rgba(255,85,85,.4);
}

.result-info {
    width: min(90%, 450px);
    padding: 25px;
    border-radius: 18px;
    background: rgba(255,255,255,.05);
    border: 1px solid #292936;
    text-align: center;
    margin-bottom: 25px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    color: #bbb;
}

.result-row strong {
    color: white;
}

.result-buttons {
    display: flex;
    gap: 12px;
}

.result-button {
    min-width: 150px;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #171720;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.result-button:hover {
    background: #252532;
}

/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    #gameTop {
        padding: 0 12px;
    }

    .current-song {
        font-size: 14px;
    }

    .status {
        font-size: 12px;
    }

    .note {
        width: 48px;
        height: 48px;
    }

    #judgeLine {
        bottom: 115px;
    }

    #keyLabels {
        height: 70px;
        bottom: 20px;
    }

    .key {
        font-size: 23px;
    }

    .result-title {
        font-size: 48px;
    }
}
</style>
</head>

<body>

<!-- =========================
     곡 선택 화면
========================= -->

<div id="menu" class="screen active">

    <div class="logo">COLOR BEAT</div>

    <div class="subtitle">
        음악에 맞춰 색깔을 입력하세요
    </div>

    <div class="song-list">

        <button class="song-button" onclick="selectSong('loveAttack')">
            <span class="song-number">SONG 01</span>
            <span class="song-name">LOVE ATTACK</span>
            <span class="song-description">RESCENE</span>
        </button>

        <button class="song-button" onclick="selectSong('lemonade')">
            <span class="song-number">SONG 02</span>
            <span class="song-name">LEMONADE</span>
            <span class="song-description">aespa</span>
        </button>

        <button class="song-button" onclick="selectSong('blueValentine')">
            <span class="song-number">SONG 03</span>
            <span class="song-name">Blue Valentine</span>
            <span class="song-description">NMIXX</span>
        </button>

    </div>

</div>


<!-- =========================
     게임 화면
========================= -->

<div id="game" class="screen">

    <div id="gameTop">
        <div class="current-song" id="currentSong">
            COLOR BEAT
        </div>

        <div class="status">
            성공 <span id="hitCount">0</span>
            /
            <span id="totalCount">0</span>
        </div>
    </div>

    <div id="playArea">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <div id="judgeLine"></div>

        <div id="keyLabels">

            <div class="key red" data-key="a">
                A
            </div>

            <div class="key yellow" data-key="s">
                S
            </div>

            <div class="key blue" data-key="d">
                D
            </div>

        </div>

    </div>

    <div id="judgeText"></div>

</div>


<!-- =========================
     카운트다운
========================= -->

<div id="countdown">
    3
</div>


<!-- =========================
     결과 화면
========================= -->

<div id="result" class="screen">

    <div id="resultTitle" class="result-title">
        CLEAR
    </div>

    <div class="result-info">

        <div class="result-row">
            <span>곡</span>
            <strong id="resultSong">-</strong>
        </div>

        <div class="result-row">
            <span>성공</span>
            <strong id="resultHits">0</strong>
        </div>

        <div class="result-row">
            <span>MISS</span>
            <strong id="resultMisses">0</strong>
        </div>

        <div class="result-row">
            <span>정확도</span>
            <strong id="resultAccuracy">0%</strong>
        </div>

    </div>

    <div class="result-buttons">

        <button class="result-button" onclick="retrySong()">
            다시 도전
        </button>

        <button class="result-button" onclick="goMenu()">
            곡 선택
        </button>

    </div>

</div>


<script>

/* ============================================================
   COLOR BEAT
   단일 HTML 버전
============================================================ */


/* ============================================================
   음악 파일
============================================================ */

const songs = {

    loveAttack: {
        title: "LOVE ATTACK",
        artist: "RESCENE",
        file: "music/love_attack.mp3",

        /*
         * 임시 BPM
         * 실제 음악 분석 후 수정할 예정
         */
        bpm: 128
    },

    lemonade: {
        title: "LEMONADE",
        artist: "aespa",
        file: "music/lemonade.mp3",

        bpm: 124
    },

    blueValentine: {
        title: "Blue Valentine",
        artist: "NMIXX",
        file: "music/blue_valentine.mp3",

        bpm: 120
    }

};


/* ============================================================
   게임 변수
============================================================ */

let selectedSong = null;

let audio = new Audio();

let gameRunning = false;

let notes = [];

let activeNotes = [];

let hitCount = 0;

let missCount = 0;

let totalNotes = 0;

let processedNotes = 0;

let animationFrame = null;

let startTime = 0;

let songEnded = false;


/*
 * 판정선까지 노트가 이동하는 시간
 *
 * 실제 게임에서 음악과 정확히 맞추기 위해
 * 나중에 조정할 수 있음.
 */
const APPROACH_TIME = 1.6;


/*
 * 판정 범위
 */

const PERFECT_WINDOW = 0.075;

const GOOD_WINDOW = 0.16;


/*
 * CLEAR 조건
 *
 * 일단 90% 이상 성공이면 클리어.
 */
const CLEAR_ACCURACY = 0.90;


/* ============================================================
   곡별 임시 패턴 생성
============================================================ */

/*
 * 현재는 게임 시스템을 먼저 확인하기 위해
 * BPM을 기준으로 기본 패턴을 자동 생성한다.
 *
 * 다음 단계에서 실제 MP3의 박자에 맞춰
 * 이 부분을 곡별 차트로 교체한다.
 */

function createChart(songKey) {

    const song = songs[songKey];

    const beat = 60 / song.bpm;

    const chart = [];

    /*
     * 곡 전체 길이를 모르더라도
     * 음악이 재생되는 동안 자동으로 노트를
     * 생성할 수 있도록 충분히 긴 차트를 만든다.
     *
     * 실제 버전에서는 MP3 분석 결과를 이용해
     * 정확한 시간값을 넣는다.
     */

    let time = 2;

    let index = 0;

    while (time < 240) {

        let color;

        /*
         * 기본 3색 패턴
         */

        const pattern = [
            "red",
            "yellow",
            "blue",
            "yellow",
            "red",
            "blue"
        ];

        color = pattern[index % pattern.length];

        /*
         * 일정 확률로 같은 박자에
         * 조금 더 빠른 노트를 넣는다.
         *
         * 실제 차트에서는 음악 분석 결과로 변경.
         */

        chart.push({
            time: time,
            color: color
        });

        /*
         * 1박 / 반박 / 빠른 부분을 섞음
         */

        if (index % 8 === 3) {
            time += beat / 2;
        } else if (index % 11 === 6) {
            time += beat / 4;
        } else {
            time += beat;
        }

        index++;
    }

    return chart;
}


/* ============================================================
   곡 선택
============================================================ */

function selectSong(songKey) {

    selectedSong = songKey;

    startCountdown();
}


/* ============================================================
   카운트다운
============================================================ */

function startCountdown() {

    showScreen("game");

    const song = songs[selectedSong];

    document.getElementById("currentSong").textContent =
        song.title + " - " + song.artist;

    const countdown = document.getElementById("countdown");

    countdown.classList.add("show");

    let number = 3;

    countdown.textContent = number;

    const timer = setInterval(() => {

        number--;

        if (number > 0) {

            countdown.textContent = number;

        } else {

            countdown.textContent = "START!";

            setTimeout(() => {

                countdown.classList.remove("show");

                clearInterval(timer);

                startGame();

            }, 500);

        }

    }, 800);
}


/* ============================================================
   게임 시작
============================================================ */

function startGame() {

    stopGame();

    gameRunning = true;

    songEnded = false;

    hitCount = 0;

    missCount = 0;

    processedNotes = 0;

    activeNotes = [];

    notes = createChart(selectedSong);

    totalNotes = notes.length;

    document.getElementById("hitCount").textContent = 0;

    document.getElementById("totalCount").textContent = totalNotes;

    /*
     * 음악 준비
     */

    audio.pause();

    audio.currentTime = 0;

    audio.src = songs[selectedSong].file;

    audio.volume = 1.0;

    /*
     * 음악 종료 감지
     */

    audio.onended = function() {

        songEnded = true;

        setTimeout(() => {

            if (gameRunning) {
                finishGame();
            }

        }, 500);

    };


    /*
     * 음악 재생
     */

    audio.play().catch(error => {

        console.log("음악 자동 재생 실패:", error);

        alert(
            "음악 재생이 차단되었습니다.\n" +
            "화면을 한 번 터치한 후 다시 시작해주세요."
        );

    });


    startTime = performance.now();

    gameLoop();
}


/* ============================================================
   게임 루프
============================================================ */

function gameLoop() {

    if (!gameRunning) {
        return;
    }

    const currentTime = audio.currentTime;

    /*
     * 새 노트 생성
     */

    while (
        notes.length > 0 &&
        notes[0].time - currentTime <= APPROACH_TIME
    ) {

        const noteData = notes.shift();

        createNote(noteData);

    }


    /*
     * 활성 노트 업데이트
     */

    for (let i = activeNotes.length - 1; i >= 0; i--) {

        const note = activeNotes[i];

        updateNote(note, currentTime);

        /*
         * 판정선을 지나갔는데 누르지 않았다면 MISS
         */

        if (
            !note.hit &&
            currentTime - note.time > GOOD_WINDOW
        ) {

            missNote(note);

            activeNotes.splice(i, 1);
        }

    }


    /*
     * 음악이 끝났고 남은 노트가 없다면 종료
     */

    if (
        songEnded &&
        activeNotes.length === 0
    ) {

        finishGame();

        return;
    }


    animationFrame =
        requestAnimationFrame(gameLoop);
}


/* ============================================================
   노트 생성
============================================================ */

function createNote(data) {

    const playArea =
        document.getElementById("playArea");

    const note =
        document.createElement("div");

    note.className =
        "note " + data.color;

    /*
     * 레인 위치
     */

    let lane;

    if (data.color === "red") {
        lane = 0;
    }

    if (data.color === "yellow") {
        lane = 1;
    }

    if (data.color === "blue") {
        lane = 2;
    }

    note.dataset.lane = lane;

    note.dataset.color = data.color;

    note.dataset.time = data.time;

    note.hit = false;

    /*
     * 화면 가로 위치
     */

    const laneWidth =
        playArea.clientWidth / 3;

    const x =
        laneWidth * lane + laneWidth / 2;

    note.style.left = x + "px";

    /*
     * 시작 위치
     */

    note.style.top = "-70px";

    playArea.appendChild(note);

    activeNotes.push(note);
}


/* ============================================================
   노트 위치 업데이트
============================================================ */

function updateNote(note, currentTime) {

    if (note.hit) {
        return;
    }

    const progress =
        (currentTime - note.dataset.time + APPROACH_TIME)
        / APPROACH_TIME;

    const judgeLine =
        document.getElementById("judgeLine");

    const startY = -70;

    const endY =
        judgeLine.offsetTop -
        29;

    const y =
        startY +
        (endY - startY) * progress;

    note.style.top = y + "px";
}


/* ============================================================
   키 입력
============================================================ */

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if (
        key !== "a" &&
        key !== "s" &&
        key !== "d"
    ) {
        return;
    }

    if (!gameRunning) {
        return;
    }

    pressKey(key);

    /*
     * 브라우저 기본 동작 방지
     */

    event.preventDefault();
});


/* ============================================================
   모바일 터치
============================================================ */

document.querySelectorAll(".key").forEach(button => {

    button.addEventListener("pointerdown", function(event) {

        const key = button.dataset.key;

        if (!gameRunning) {
            return;
        }

        pressKey(key);

        event.preventDefault();
    });

});


/* ============================================================
   키 입력 처리
============================================================ */

function pressKey(key) {

    const lane =
        key === "a" ? 0 :
        key === "s" ? 1 :
        2;

    const color =
        key === "a" ? "red" :
        key === "s" ? "yellow" :
        "blue";


    /*
     * 키 애니메이션
     */

    const keyElement =
        document.querySelector(
            `.key[data-key="${key}"]`
        );

    if (keyElement) {

        keyElement.classList.add("pressed");

        setTimeout(() => {

            keyElement.classList.remove("pressed");

        }, 80);

    }


    /*
     * 가장 가까운 노트 찾기
     */

    let target = null;

    let smallestDifference =
        Infinity;

    const currentTime =
        audio.currentTime;


    for (const note of activeNotes) {

        if (note.hit) {
            continue;
        }

        if (
            Number(note.dataset.lane) !== lane
        ) {
            continue;
        }

        const difference =
            Math.abs(
                currentTime -
                Number(note.dataset.time)
            );

        if (
            difference < smallestDifference
        ) {

            smallestDifference = difference;

            target = note;
        }

    }


    /*
     * 판정
     */

    if (
        target &&
        smallestDifference <= GOOD_WINDOW
    ) {

        if (
            smallestDifference <=
            PERFECT_WINDOW
        ) {

            hitNote(target, "PERFECT");

        } else {

            hitNote(target, "GOOD");

        }

    } else {

        /*
         * 빈 공간을 누른 경우
         */

        showJudge("MISS", "miss");

    }

}


/* ============================================================
   성공 판정
============================================================ */

function hitNote(note, result) {

    if (note.hit) {
        return;
    }

    note.hit = true;

    hitCount++;

    processedNotes++;

    document.getElementById("hitCount").textContent =
        hitCount;

    showJudge(
        result,
        result === "PERFECT"
            ? "perfect"
            : "good"
    );

    note.remove();

    const index =
        activeNotes.indexOf(note);

    if (index !== -1) {
        activeNotes.splice(index, 1);
    }
}


/* ============================================================
   MISS
============================================================ */

function missNote(note) {

    if (note.hit) {
        return;
    }

    note.hit = true;

    missCount++;

    processedNotes++;

    showJudge("MISS", "miss");

    note.remove();
}


/* ============================================================
   판정 텍스트
============================================================ */

function showJudge(text, className) {

    const judge =
        document.getElementById("judgeText");

    judge.className = "";

    judge.textContent = text;

    /*
     * animation 재시작
     */

    void judge.offsetWidth;

    judge.classList.add(
        "show",
        className
    );
}


/* ============================================================
   게임 종료
============================================================ */

function finishGame() {

    if (!gameRunning) {
        return;
    }

    gameRunning = false;

    if (animationFrame) {

        cancelAnimationFrame(animationFrame);

        animationFrame = null;
    }

    audio.pause();

    /*
     * 남은 노트 정리
     */

    activeNotes.forEach(note => {

        note.remove();

    });

    activeNotes = [];

    /*
     * 정확도
     */

    const totalProcessed =
        hitCount + missCount;

    let accuracy = 0;

    if (totalProcessed > 0) {

        accuracy =
            hitCount / totalProcessed;

    }

    const percent =
        Math.round(accuracy * 100);

    /*
     * CLEAR 여부
     */

    const clear =
        accuracy >= CLEAR_ACCURACY;


    /*
     * 결과 화면
     */

    const title =
        document.getElementById("resultTitle");

    title.textContent =
        clear ? "CLEAR!" : "FAILED";

    title.className =
        "result-title " +
        (clear ? "clear" : "failed");


    document.getElementById("resultSong").textContent =
        songs[selectedSong].title;

    document.getElementById("resultHits").textContent =
        hitCount;

    document.getElementById("resultMisses").textContent =
        missCount;

    document.getElementById("resultAccuracy").textContent =
        percent + "%";


    showScreen("result");
}


/* ============================================================
   다시 도전
============================================================ */

function retrySong() {

    showScreen("game");

    startCountdown();
}


/* ============================================================
   메뉴
============================================================ */

function goMenu() {

    stopGame();

    showScreen("menu");
}


/* ============================================================
   게임 정지
============================================================ */

function stopGame() {

    gameRunning = false;

    if (animationFrame) {

        cancelAnimationFrame(animationFrame);

        animationFrame = null;
    }

    audio.pause();

    audio.currentTime = 0;

    activeNotes.forEach(note => {

        note.remove();

    });

    activeNotes = [];

    notes = [];
}


/* ============================================================
   화면 변경
============================================================ */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");
}


/* ============================================================
   브라우저 이탈 방지
============================================================ */

window.addEventListener("beforeunload", function() {

    audio.pause();

});


/* ============================================================
   초기화
============================================================ */

showScreen("menu");

</script>

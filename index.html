<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>COLOR BEAT</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07070b;
    color:white;
    font-family:Arial,"Noto Sans KR",sans-serif;
    user-select:none;
}

button{
    font:inherit;
    cursor:pointer;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* =========================
   MENU
========================= */

#menuScreen{
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 30%,#252536 0%,#0c0c12 45%,#050509 100%);
}

.menu{
    width:min(90%,560px);
    text-align:center;
}

.logo p{
    margin:0 0 8px;
    color:#888;
    letter-spacing:5px;
    font-size:12px;
}

.logo h1{
    margin:0;
    font-size:60px;
    font-weight:900;
    letter-spacing:4px;
}

.logo .description{
    margin-top:12px;
    color:#888;
}

.songList{
    margin-top:45px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.songButton{
    width:100%;
    padding:20px 22px;
    border:1px solid #30303b;
    border-radius:15px;
    background:#14141c;
    color:white;
    text-align:left;
    transition:.15s;
}

.songButton:hover{
    background:#20202a;
    transform:translateY(-2px);
}

.songButton .number{
    display:block;
    color:#666;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:5px;
}

.songButton strong{
    display:block;
    font-size:23px;
}

.songButton span:last-child{
    display:block;
    color:#888;
    margin-top:4px;
}

.menuHelp{
    margin-top:25px;
    color:#666;
    font-size:13px;
}

/* =========================
   GAME
========================= */

#gameScreen{
    justify-content:center;
}

.game{
    position:relative;
    width:min(100vw,650px);
    height:100%;
    background:#0b0b11;
    overflow:hidden;
    border-left:1px solid #25252e;
    border-right:1px solid #25252e;
}

.gameHeader{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:65px;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(7,7,11,.96);
    border-bottom:1px solid #282832;
}

.back{
    position:absolute;
    left:14px;
    width:40px;
    height:40px;
    border:0;
    border-radius:10px;
    background:#1a1a22;
    color:white;
    font-size:22px;
}

.songInfo{
    text-align:center;
}

.songInfo strong{
    display:block;
    font-size:16px;
}

.songInfo span{
    display:block;
    color:#777;
    font-size:11px;
    margin-top:3px;
}

.gameStats{
    position:absolute;
    right:15px;
    text-align:right;
}

.gameStats div{
    font-size:12px;
    color:#999;
}

.gameStats strong{
    color:white;
}

/* =========================
   PLAY AREA
========================= */

.playArea{
    position:absolute;
    top:65px;
    bottom:145px;
    left:0;
    right:0;
    overflow:hidden;
}

.lane{
    position:absolute;
    top:0;
    bottom:0;
    width:33.3333%;
    border-left:1px solid rgba(255,255,255,.08);
}

.lane0{
    left:0;
    background:linear-gradient(to bottom,rgba(255,40,40,.09),rgba(255,40,40,.015));
}

.lane1{
    left:33.3333%;
    background:linear-gradient(to bottom,rgba(255,220,0,.09),rgba(255,220,0,.015));
}

.lane2{
    left:66.6666%;
    background:linear-gradient(to bottom,rgba(40,120,255,.09),rgba(40,120,255,.015));
}

.noteContainer{
    position:absolute;
    inset:0;
    z-index:10;
}

.note{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    transform:translateX(-50%);
    border:3px solid white;
    box-shadow:0 0 12px currentColor,0 0 28px currentColor;
}

.note.red{
    background:#ff3030;
    color:#ff3030;
}

.note.yellow{
    background:#ffe000;
    color:#ffe000;
}

.note.blue{
    background:#3185ff;
    color:#3185ff;
}

.judgeLine{
    position:absolute;
    left:0;
    right:0;
    bottom:35px;
    height:4px;
    background:white;
    box-shadow:0 0 12px white;
    z-index:20;
}

.judgeText{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    z-index:40;
    font-size:34px;
    font-weight:900;
    pointer-events:none;
    opacity:0;
}

.judgeText.show{
    animation:judgeAnim .35s ease-out;
}

@keyframes judgeAnim{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.7);
    }
    30%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1);
    }
}

.countdown{
    position:absolute;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    z-index:50;
    font-size:80px;
    font-weight:900;
    text-shadow:0 0 25px white;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:145px;
    z-index:30;
    display:grid;
    grid-template-columns:repeat(3,1fr);
}

.control{
    border:0;
    border-top:3px solid;
    background:#111118;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition:.07s;
}

.control span{
    font-size:11px;
    opacity:.6;
}

.control strong{
    font-size:30px;
}

.control.red{
    border-color:#ff3030;
}

.control.yellow{
    border-color:#ffe000;
}

.control.blue{
    border-color:#3185ff;
}

.control.red.active{
    background:rgba(255,40,40,.3);
}

.control.yellow.active{
    background:rgba(255,220,0,.25);
}

.control.blue.active{
    background:rgba(40,120,255,.3);
}

.control.active{
    transform:scale(.96);
}

/* =========================
   START OVERLAY
========================= */

.startOverlay{
    position:absolute;
    inset:0;
    z-index:60;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(5,5,9,.94);
}

.startOverlay h2{
    margin:0;
    font-size:45px;
}

.startOverlay p{
    color:#888;
}

.startBtn{
    margin-top:25px;
    padding:16px 55px;
    border:0;
    border-radius:12px;
    background:white;
    color:#111;
    font-weight:bold;
}

/* =========================
   RESULT
========================= */

#resultScreen{
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 35%,#272738,#08080c 70%);
}

.result{
    width:min(90%,520px);
    text-align:center;
}

.resultSmall{
    color:#777;
    letter-spacing:4px;
    font-size:12px;
}

.result h1{
    margin:10px 0;
    font-size:70px;
}

.resultSong{
    color:#aaa;
}

.resultStats{
    margin-top:35px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.resultStat{
    padding:18px 5px;
    border-radius:12px;
    background:#15151d;
}

.resultStat span{
    display:block;
    color:#777;
    font-size:11px;
}

.resultStat strong{
    display:block;
    margin-top:7px;
    font-size:22px;
}

.reward{
    margin-top:25px;
    padding:20px;
    border:1px solid #383842;
    border-radius:15px;
    background:#14141c;
}

.rewardIcon{
    font-size:38px;
}

.rewardTitle{
    display:block;
    margin-top:8px;
    font-size:20px;
}

.rewardMessage{
    color:#999;
    margin-bottom:0;
}

.resultButtons{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.resultButtons button{
    padding:15px;
    border:0;
    border-radius:10px;
    background:#24242d;
    color:white;
}

.resultButtons button:first-child{
    background:white;
    color:#111;
}

/* =========================
   AUDIO
========================= */

audio{
    display:none;
}

@media(max-width:600px){

    .logo h1{
        font-size:43px;
    }

    .note{
        width:42px;
        height:42px;
    }

    .gameHeader{
        height:58px;
    }

    .playArea{
        top:58px;
        bottom:125px;
    }

    .controls{
        height:125px;
    }

}
</style>
</head>


<body>

<!-- =========================
     MENU
========================= -->

<section id="menuScreen" class="screen active">

    <div class="menu">

        <div class="logo">
            <p>RHYTHM GAME</p>
            <h1>COLOR BEAT</h1>

            <div class="description">
                음악의 흐름에 맞춰 색을 입력하세요
            </div>
        </div>

        <div class="songList">

            <button
                class="songButton"
                data-song="lemonade"
            >
                <span class="number">SONG 01</span>
                <strong>LEMONADE</strong>
                <span>aespa</span>
            </button>

            <button
                class="songButton"
                disabled
                style="opacity:.35;cursor:not-allowed"
            >
                <span class="number">SONG 02</span>
                <strong>LOVE ATTACK</strong>
                <span>RESCENE · 준비 중</span>
            </button>

            <button
                class="songButton"
                disabled
                style="opacity:.35;cursor:not-allowed"
            >
                <span class="number">SONG 03</span>
                <strong>BLUE VALENTINE</strong>
                <span>NMIXX · 준비 중</span>
            </button>

        </div>

        <div class="menuHelp">
            PC: A / S / D &nbsp; · &nbsp; 모바일: 화면 버튼
        </div>

    </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="screen">

    <div class="game">

        <div class="gameHeader">

            <button
                class="back"
                id="gameBack"
            >
                ←
            </button>

            <div class="songInfo">
                <strong id="gameSongName">
                    LEMONADE
                </strong>

                <span id="gameArtist">
                    aespa
                </span>
            </div>

            <div class="gameStats">

                <div>
                    HIT
                    <strong id="hitCount">0</strong>
                </div>

                <div>
                    MISS
                    <strong id="missCount">0</strong>
                </div>

            </div>

        </div>


        <div class="playArea">

            <div class="lane lane0"></div>
            <div class="lane lane1"></div>
            <div class="lane lane2"></div>

            <div
                class="noteContainer"
                id="noteContainer"
            ></div>

            <div class="judgeLine"></div>

            <div
                class="judgeText"
                id="judgeText"
            ></div>

            <div
                class="countdown"
                id="countdown"
            ></div>

        </div>


        <div class="controls">

            <button
                class="control red"
                data-lane="0"
            >
                <span>RED</span>
                <strong>A</strong>
            </button>

            <button
                class="control yellow"
                data-lane="1"
            >
                <span>YELLOW</span>
                <strong>S</strong>
            </button>

            <button
                class="control blue"
                data-lane="2"
            >
                <span>BLUE</span>
                <strong>D</strong>
            </button>

        </div>


        <div
            class="startOverlay"
            id="startOverlay"
        >

            <h2>LEMONADE</h2>

            <p>
                aespa
            </p>

            <button
                class="startBtn"
                id="startBtn"
            >
                START
            </button>

        </div>


        <audio
            id="music"
            preload="metadata"
        >

            <source
                src="./music/lemonade.mp3"
                type="audio/mpeg"
            >

        </audio>

    </div>

</section>


<!-- =========================
     RESULT
========================= -->

<section
    id="resultScreen"
    class="screen"
>

    <div class="result">

        <div class="resultSmall">
            SONG COMPLETE
        </div>

        <h1 id="resultTitle">
            CLEAR
        </h1>

        <div
            class="resultSong"
            id="resultSong"
        >
            LEMONADE · aespa
        </div>


        <div class="resultStats">

            <div class="resultStat">
                <span>HIT</span>
                <strong id="resultHit">0</strong>
            </div>

            <div class="resultStat">
                <span>MISS</span>
                <strong id="resultMiss">0</strong>
            </div>

            <div class="resultStat">
                <span>ACCURACY</span>
                <strong id="resultAccuracy">0%</strong>
            </div>

        </div>


        <div class="reward">

            <div
                class="rewardIcon"
                id="rewardIcon"
            >
                🎁
            </div>

            <strong
                class="rewardTitle"
                id="rewardTitle"
            >
                CLEAR REWARD
            </strong>

            <p
                class="rewardMessage"
                id="rewardMessage"
            >
                클리어 보상을 획득했습니다!
            </p>

        </div>


        <div class="resultButtons">

            <button id="retryBtn">
                다시 하기
            </button>

            <button id="menuBtn">
                곡 선택
            </button>

        </div>

    </div>

</section>


<script>

/* =========================================================
   SONG DATA
========================================================= */

const songs = {

    lemonade: {

        title: "LEMONADE",

        artist: "aespa",

        file: "./music/lemonade.mp3",

        /*
         * 실제 곡 전체 노트 데이터가 들어갈 자리.
         *
         * 현재는 테스트를 위해 일부만 넣어둔다.
         *
         * lane:
         * 0 = 빨강
         * 1 = 노랑
         * 2 = 파랑
         */

        notes: [

            {time:2.00,lane:0},
            {time:2.50,lane:1},
            {time:3.00,lane:2},

            {time:3.50,lane:0},
            {time:4.00,lane:2},
            {time:4.50,lane:1},

            {time:5.00,lane:0},
            {time:5.35,lane:1},
            {time:5.70,lane:2},

            {time:6.20,lane:2},
            {time:6.70,lane:1},
            {time:7.20,lane:0},

            {time:7.70,lane:1},
            {time:8.10,lane:2},
            {time:8.50,lane:0},

            {time:9.00,lane:0},
            {time:9.35,lane:2},
            {time:9.70,lane:1},

            {time:10.20,lane:2},
            {time:10.70,lane:0},
            {time:11.20,lane:1},

            {time:11.70,lane:0},
            {time:12.10,lane:1},
            {time:12.50,lane:2},

            {time:13.00,lane:2},
            {time:13.40,lane:0},
            {time:13.80,lane:1},

            {time:14.30,lane:1},
            {time:14.65,lane:2},
            {time:15.00,lane:0},

            {time:15.50,lane:0},
            {time:15.85,lane:1},
            {time:16.20,lane:2},

            {time:16.70,lane:1},
            {time:17.20,lane:0},
            {time:17.70,lane:2},

            {time:18.20,lane:2},
            {time:18.55,lane:1},
            {time:18.90,lane:0},

            {time:19.40,lane:0},
            {time:19.80,lane:2},
            {time:20.20,lane:1},

            {time:20.70,lane:2},
            {time:21.20,lane:0},
            {time:21.70,lane:1},

            {time:22.20,lane:1},
            {time:22.55,lane:2},
            {time:22.90,lane:0},

            {time:23.40,lane:0},
            {time:23.80,lane:1},
            {time:24.20,lane:2}

        ]

    }

};


/* =========================================================
   DOM
========================================================= */

const menuScreen =
    document.getElementById("menuScreen");

const gameScreen =
    document.getElementById("gameScreen");

const resultScreen =
    document.getElementById("resultScreen");

const startOverlay =
    document.getElementById("startOverlay");

const startBtn =
    document.getElementById("startBtn");

const gameBack =
    document.getElementById("gameBack");

const retryBtn =
    document.getElementById("retryBtn");

const menuBtn =
    document.getElementById("menuBtn");

const music =
    document.getElementById("music");

const noteContainer =
    document.getElementById("noteContainer");

const countdown =
    document.getElementById("countdown");

const judgeText =
    document.getElementById("judgeText");

const hitCount =
    document.getElementById("hitCount");

const missCount =
    document.getElementById("missCount");

const resultTitle =
    document.getElementById("resultTitle");

const resultHit =
    document.getElementById("resultHit");

const resultMiss =
    document.getElementById("resultMiss");

const resultAccuracy =
    document.getElementById("resultAccuracy");

const rewardIcon =
    document.getElementById("rewardIcon");

const rewardTitle =
    document.getElementById("rewardTitle");

const rewardMessage =
    document.getElementById("rewardMessage");


/* =========================================================
   GAME VARIABLES
========================================================= */

let currentSong = songs.lemonade;

let running = false;

let animationFrame = null;

let noteIndex = 0;

let activeNotes = [];

let hit = 0;

let miss = 0;

let totalNotes = 0;


/*
 * 노트가 이동하는 시간.
 *
 * 1.5초 전에 화면 위에서 생성되어
 * 판정선까지 내려온다.
 */

const travelTime = 1.5;


/*
 * 판정 허용 시간.
 *
 * 현재 테스트용.
 *
 * 나중에 부스 난이도에 맞게 줄일 수 있다.
 */

const hitWindow = 0.16;


/* =========================================================
   MENU
========================================================= */

document
.querySelectorAll(".songButton[data-song]")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const id =
                button.dataset.song;

            if (!songs[id]) {
                return;
            }

            currentSong =
                songs[id];

            openGame();

        }
    );

});


function openGame(){

    menuScreen.classList.remove("active");

    resultScreen.classList.remove("active");

    gameScreen.classList.add("active");

    startOverlay.style.display =
        "flex";

    resetGame();

}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    running = false;

    if (animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }

    music.pause();

    music.currentTime = 0;

    noteIndex = 0;

    activeNotes = [];

    hit = 0;

    miss = 0;

    totalNotes =
        currentSong.notes.length;

    noteContainer.innerHTML = "";

    updateHUD();

}


/* =========================================================
   START
========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);


async function startGame(){

    resetGame();

    startOverlay.style.display =
        "none";

    await countdownStart();

    try{

        music.src =
            currentSong.file;

        music.currentTime = 0;

        await music.play();

    }
    catch(error){

        console.error(error);

        alert(
            "음악을 재생할 수 없습니다."
        );

        startOverlay.style.display =
            "flex";

        return;

    }

    running = true;

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdownStart(){

    return new Promise(resolve => {

        let count = 3;

        function tick(){

            if(count > 0){

                countdown.textContent =
                    count;

                count--;

                setTimeout(
                    tick,
                    650
                );

            }
            else{

                countdown.textContent =
                    "START!";

                setTimeout(
                    () => {

                        countdown.textContent =
                            "";

                        resolve();

                    },
                    450
                );

            }

        }

        tick();

    });

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    if(!running){
        return;
    }

    const time =
        music.currentTime;

    createNotes(time);

    updateNotes(time);

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   CREATE NOTES
========================================================= */

function createNotes(time){

    while(
        noteIndex <
        currentSong.notes.length
    ){

        const data =
            currentSong.notes[noteIndex];

        const spawnTime =
            data.time -
            travelTime;

        if(time < spawnTime){
            break;
        }

        createNote(data);

        noteIndex++;

    }

}


/* =========================================================
   CREATE NOTE
========================================================= */

function createNote(data){

    const note =
        document.createElement("div");

    const colorNames = [
        "red",
        "yellow",
        "blue"
    ];

    note.className =
        "note " +
        colorNames[data.lane];

    const playArea =
        document.querySelector(".playArea");

    const laneWidth =
        playArea.clientWidth / 3;

    const x =
        laneWidth *
        data.lane +
        laneWidth / 2;

    note.style.left =
        x + "px";

    note.style.top =
        "-60px";

    note.dataset.lane =
        data.lane;

    note.noteTime =
        data.time;

    note.hit =
        false;

    noteContainer.appendChild(
        note
    );

    activeNotes.push(
        note
    );

}


/* =========================================================
   UPDATE NOTES
========================================================= */

function updateNotes(time){

    const judgeLine =
        document.querySelector(
            ".judgeLine"
        );

    const startY =
        -60;

    const endY =
        judgeLine.offsetTop - 24;


    for(
        let i =
            activeNotes.length - 1;

        i >= 0;

        i--
    ){

        const note =
            activeNotes[i];

        if(note.hit){
            continue;
        }

        const remaining =
            note.noteTime -
            time;

        let progress =
            1 -
            remaining /
            travelTime;

        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );

        const y =
            startY +
            (
                endY -
                startY
            ) *
            progress;

        note.style.top =
            y + "px";


        /*
         * 판정 시간 초과
         */

        if(
            time -
            note.noteTime >
            hitWindow
        ){

            missNote(note);

        }

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(!running){
            return;
        }

        let lane = -1;

        if(
            event.key === "a" ||
            event.key === "A"
        ){
            lane = 0;
        }

        if(
            event.key === "s" ||
            event.key === "S"
        ){
            lane = 1;
        }

        if(
            event.key === "d" ||
            event.key === "D"
        ){
            lane = 2;
        }

        if(lane !== -1){

            pressButtonVisual(lane);

            pressLane(lane);

        }

    }
);


/* =========================================================
   MOBILE / BUTTON
========================================================= */

document
.querySelectorAll(".control")
.forEach(button => {

    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            const lane =
                Number(
                    button.dataset.lane
                );

            button.classList.add(
                "active"
            );

            setTimeout(
                () => {

                    button.classList.remove(
                        "active"
                    );

                },
                100
            );

            pressLane(lane);

        }
    );

});


function pressButtonVisual(lane){

    const button =
        document.querySelector(
            `.control[data-lane="${lane}"]`
        );

    if(!button){
        return;
    }

    button.classList.add(
        "active"
    );

    setTimeout(
        () => {

            button.classList.remove(
                "active"
            );

        },
        100
    );

}


/* =========================================================
   HIT CHECK
========================================================= */

function pressLane(lane){

    if(!running){
        return;
    }

    const currentTime =
        music.currentTime;

    let target = null;

    let closest =
        Infinity;


    for(
        const note of activeNotes
    ){

        if(note.hit){
            continue;
        }

        if(
            Number(note.dataset.lane) !==
            lane
        ){
            continue;
        }

        const difference =
            Math.abs(
                note.noteTime -
                currentTime
            );

        if(
            difference <
            closest
        ){

            closest =
                difference;

            target =
                note;

        }

    }


    if(
        target &&
        closest <= hitWindow
    ){

        hitNote(target);

    }

}


/* =========================================================
   HIT
========================================================= */

function hitNote(note){

    if(note.hit){
        return;
    }

    note.hit = true;

    hit++;

    updateHUD();

    showJudge("HIT");

    removeNote(note);

}


/* =========================================================
   MISS
========================================================= */

function missNote(note){

    if(note.hit){
        return;
    }

    note.hit = true;

    miss++;

    updateHUD();

    showJudge("MISS");

    removeNote(note);

}


/* =========================================================
   REMOVE
========================================================= */

function removeNote(note){

    const index =
        activeNotes.indexOf(
            note
        );

    if(index !== -1){

        activeNotes.splice(
            index,
            1
        );

    }

    if(note.parentNode){

        note.parentNode.removeChild(
            note
        );

    }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    hitCount.textContent =
        hit;

    missCount.textContent =
        miss;

}


/* =========================================================
   JUDGE
========================================================= */

function showJudge(text){

    judgeText.textContent =
        text;

    judgeText.classList.remove(
        "show"
    );

    void judgeText.offsetWidth;

    judgeText.classList.add(
        "show"
    );

}


/* =========================================================
   MUSIC END
========================================================= */

music.addEventListener(
    "ended",
    finishGame
);


function finishGame(){

    if(!running){
        return;
    }

    running = false;

    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

    }


    /*
     * 남아 있는 노트 처리
     */

    for(
        const note of [...activeNotes]
    ){

        if(!note.hit){

            note.hit = true;

            miss++;

            removeNote(note);

        }

    }


    updateHUD();


    /*
     * 정확도
     */

    const accuracy =
        totalNotes > 0
        ? hit / totalNotes * 100
        : 0;


    /*
     * 현재 테스트 버전의
     * 클리어 기준
     *
     * 90% 이상
     */

    const cleared =
        accuracy >= 90;


    showResult(
        cleared,
        accuracy
    );

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    cleared,
    accuracy
){

    gameScreen.classList.remove(
        "active"
    );

    resultScreen.classList.add(
        "active"
    );


    resultTitle.textContent =
        cleared
        ? "CLEAR"
        : "FAILED";


    resultTitle.style.color =
        cleared
        ? "#ffffff"
        : "#ff4040";


    resultHit.textContent =
        hit;

    resultMiss.textContent =
        miss;

    resultAccuracy.textContent =
        accuracy.toFixed(1) +
        "%";


    if(cleared){

        rewardIcon.textContent =
            "🎁";

        rewardTitle.textContent =
            "CLEAR REWARD";

        rewardMessage.textContent =
            "클리어 보상을 획득했습니다!";

    }
    else{

        rewardIcon.textContent =
            "❌";

        rewardTitle.textContent =
            "NO REWARD";

        rewardMessage.textContent =
            "클리어하지 못했습니다.";

    }

}


/* =========================================================
   BACK
========================================================= */

gameBack.addEventListener(
    "click",
    () => {

        music.pause();

        running = false;

        if(animationFrame){

            cancelAnimationFrame(
                animationFrame
            );

        }

        gameScreen.classList.remove(
            "active"
        );

        menuScreen.classList.add(
            "active"
        );

    }
);


/* =========================================================
   RETRY
========================================================= */

retryBtn.addEventListener(
    "click",
    () => {

        resultScreen.classList.remove(
            "active"
        );

        gameScreen.classList.add(
            "active"
        );

        startOverlay.style.display =
            "flex";

        resetGame();

    }
);


/* =========================================================
   MENU
========================================================= */

menuBtn.addEventListener(
    "click",
    () => {

        music.pause();

        running = false;

        if(animationFrame){

            cancelAnimationFrame(
                animationFrame
            );

        }

        resultScreen.classList.remove(
            "active"
        );

        gameScreen.classList.remove(
            "active"
        );

        menuScreen.classList.add(
            "active"
        );

    }
);

</script>

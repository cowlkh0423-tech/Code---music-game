<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>COLOR BEAT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         곡 선택 화면
    ========================== -->

    <section id="menuScreen" class="screen active">

        <h1>COLOR BEAT</h1>

        <p class="description">
            음악에 맞춰 내려오는 원을 터치하세요
        </p>

        <div class="songList">

            <button
                class="songButton"
                onclick="selectSong('lemonade')"
            >
                <span class="songNumber">
                    SONG 01
                </span>

                <span class="songTitle">
                    LEMONADE
                </span>

                <span class="songArtist">
                    aespa
                </span>
            </button>


            <button
                class="songButton"
                onclick="selectSong('love_attack')"
            >
                <span class="songNumber">
                    SONG 02
                </span>

                <span class="songTitle">
                    LOVE ATTACK
                </span>

                <span class="songArtist">
                    RESCENE
                </span>
            </button>


            <button
                class="songButton"
                onclick="selectSong('blue_valentine')"
            >
                <span class="songNumber">
                    SONG 03
                </span>

                <span class="songTitle">
                    Blue Valentine
                </span>

                <span class="songArtist">
                    NMIXX
                </span>
            </button>

        </div>

    </section>


    <!-- =========================
         게임 화면
    ========================== -->

    <section id="gameScreen" class="screen">

        <div id="gameHeader">

            <button
                id="backButton"
                onclick="goMenu()"
            >
                ←
            </button>

            <div id="playingSong">
                LEMONADE
            </div>

            <div id="gameInfo">
                <span id="hitCount">
                    0
                </span>

                <span>
                    /
                </span>

                <span id="missCount">
                    0
                </span>
            </div>

        </div>


        <!-- 게임 영역 -->

        <div id="gameArea">

            <!-- 빨강 레인 -->
            <div
                class="lane redLane"
                data-lane="0"
            ></div>

            <!-- 노랑 레인 -->
            <div
                class="lane yellowLane"
                data-lane="1"
            ></div>

            <!-- 파랑 레인 -->
            <div
                class="lane blueLane"
                data-lane="2"
            ></div>


            <!-- 판정선 -->

            <div id="judgeLine"></div>


            <!-- 노트가 생성되는 곳 -->

            <div id="noteContainer"></div>


            <!-- 터치 영역 -->

            <div id="touchArea">

                <button
                    class="touchButton redButton"
                    data-lane="0"
                    onclick="pressLane(0)"
                >
                    RED
                </button>

                <button
                    class="touchButton yellowButton"
                    data-lane="1"
                    onclick="pressLane(1)"
                >
                    YELLOW
                </button>

                <button
                    class="touchButton blueButton"
                    data-lane="2"
                    onclick="pressLane(2)"
                >
                    BLUE
                </button>

            </div>

        </div>


        <!-- 판정 글자 -->

        <div id="judgeText">
        </div>

    </section>


    <!-- =========================
         결과 화면
    ========================== -->

    <section id="resultScreen" class="screen">

        <h2 id="resultTitle">
            CLEAR
        </h2>


        <div class="resultBox">

            <div class="resultRow">
                <span>
                    성공
                </span>

                <strong id="resultHit">
                    0
                </strong>
            </div>


            <div class="resultRow">
                <span>
                    MISS
                </span>

                <strong id="resultMiss">
                    0
                </strong>
            </div>


            <div class="resultRow">
                <span>
                    정확도
                </span>

                <strong id="resultAccuracy">
                    0%
                </strong>
            </div>

        </div>


        <div id="rewardMessage">
        </div>


        <div class="resultButtons">

            <button
                onclick="retrySong()"
            >
                다시 하기
            </button>


            <button
                onclick="goMenu()"
            >
                곡 선택
            </button>

        </div>

    </section>


    <!-- =========================
         음악
    ========================== -->

    <audio
        id="music"
        preload="auto"
    ></audio>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="js/game.js"></script>

</body>
</html>

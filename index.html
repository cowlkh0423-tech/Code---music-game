<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COLOR BEAT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: min(90%, 500px);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 35px;
        }

        button {
            width: 100%;
            padding: 20px;

            border: none;
            border-radius: 15px;

            background: #333;
            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 25px;
            min-height: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>COLOR BEAT</h1>

        <p>음악 재생 테스트</p>

        <button id="playButton">
            ▶ LEMONADE 재생
        </button>

        <div id="status"></div>

    </div>


    <!-- 음악 -->
    <audio
        id="music"
        preload="auto"
        src="./music/lemonade.mp3">
    </audio>


    <script>

        const music =
            document.getElementById("music");

        const playButton =
            document.getElementById("playButton");

        const status =
            document.getElementById("status");


        playButton.addEventListener(
            "click",
            async function () {

                try {

                    await music.play();

                    status.textContent =
                        "🎵 음악이 재생되고 있습니다.";

                    playButton.textContent =
                        "⏸ 음악 재생 중";

                }

                catch (error) {

                    console.error(error);

                    status.textContent =
                        "❌ 음악을 재생할 수 없습니다.";

                }

            }
        );


        music.addEventListener(
            "ended",
            function () {

                status.textContent =
                    "음악 재생이 끝났습니다.";

                playButton.textContent =
                    "▶ 다시 재생";

            }
        );

    </script>

</body>
</html>

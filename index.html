<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLOR BEAT</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
    color:white;
    font-family:Arial,"Noto Sans KR",sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   SCREEN
========================= */

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* =========================
   MENU
========================= */

#menuScreen{
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 25%,
            #303040 0%,
            #12121b 35%,
            #050507 80%
        );
}

.menu{
    width:min(90%,560px);
    text-align:center;
}

.logo small{
    color:#777;
    letter-spacing:6px;
    font-size:12px;
}

.logo h1{
    margin:8px 0;
    font-size:62px;
    letter-spacing:5px;
}

.logo p{
    color:#888;
    font-size:14px;
}

.songList{
    margin-top:38px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.songButton{
    position:relative;
    overflow:hidden;
    width:100%;
    padding:19px 22px;
    border:1px solid #30303a;
    border-radius:15px;
    background:#15151d;
    color:white;
    text-align:left;
    transition:.15s;
}

.songButton::after{
    content:"";
    position:absolute;
    left:-100%;
    top:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.08),
        transparent
    );
    transition:.35s;
}

.songButton:hover::after{
    left:100%;
}

.songButton:hover{
    transform:translateY(-2px);
    background:#20202a;
}

.songButton small{
    display:block;
    color:#666;
    letter-spacing:3px;
}

.songButton strong{
    display:block;
    margin-top:4px;
    font-size:22px;
}

.songButton span{
    display:block;
    margin-top:5px;
    color:#888;
}

.help{
    margin-top:20px;
    color:#555;
    font-size:12px;
}

/* =========================
   GAME
========================= */

#gameScreen{
    justify-content:center;
}

.game{
    position:relative;
    width:min(100vw,650px);
    height:100%;
    overflow:hidden;
    background:#07070c;
}

/* =========================
   HEADER
========================= */

.header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(5,5,9,.96);
    border-bottom:1px solid #292932;
}

.backButton{
    position:absolute;
    left:12px;
    width:40px;
    height:40px;

    border:0;
    border-radius:10px;

    background:#191921;
    color:white;
    font-size:22px;
}

.songInfo{
    text-align:center;
}

.songInfo strong{
    display:block;
    font-size:16px;
}

.songInfo span{
    display:block;
    margin-top:3px;
    color:#777;
    font-size:11px;
}

.scoreBox{
    position:absolute;
    right:15px;
    text-align:right;
}

.scoreBox small{
    color:#777;
}

.scoreBox strong{
    display:block;
    font-size:18px;
}

/* =========================
   PLAY AREA
========================= */

.playArea{
    position:absolute;
    top:64px;
    bottom:130px;
    left:0;
    right:0;
    overflow:hidden;

    background:#08080e;
}

/* 피아노 타일 느낌의 세로 배경 */

.pianoBackground{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:0;
}

.pianoLane{
    position:relative;
    border-left:1px solid rgba(255,255,255,.08);
    border-right:1px solid rgba(255,255,255,.025);

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0px,
            rgba(255,255,255,.045) 2px,
            transparent 2px,
            transparent 92px
        );
}

.pianoLane::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:0;
    bottom:0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,.65) 0px,
            rgba(0,0,0,.65) 44px,
            rgba(255,255,255,.025) 44px,
            rgba(255,255,255,.025) 46px,
            rgba(0,0,0,.65) 46px,
            rgba(0,0,0,.65) 92px
        );

    opacity:.8;
}

.pianoLane.red{
    box-shadow:
        inset 0 0 35px rgba(255,40,40,.06);
}

.pianoLane.yellow{
    box-shadow:
        inset 0 0 35px rgba(255,220,0,.06);
}

.pianoLane.blue{
    box-shadow:
        inset 0 0 35px rgba(40,120,255,.06);
}

/* =========================
   NOTE AREA
========================= */

.notes{
    position:absolute;
    inset:0;
    z-index:20;
}

/* 실제 음표 */

.note{
    position:absolute;

    width:44px;
    height:52px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 0 8px currentColor
        );

    transition:
        filter .05s;
}

.note::before{
    content:"";
    position:absolute;

    left:5px;
    bottom:5px;

    width:27px;
    height:27px;

    border-radius:50%;
    background:currentColor;

    box-shadow:
        0 0 12px currentColor,
        0 0 25px currentColor;
}

.note::after{
    content:"";

    position:absolute;

    left:27px;
    top:1px;

    width:5px;
    height:39px;

    border-radius:5px;

    background:currentColor;

    box-shadow:
        0 0 8px currentColor;
}

.note.red{
    color:#ff3d48;
}

.note.yellow{
    color:#ffe329;
}

.note.blue{
    color:#3d8cff;
}

/* 음표 꼬리 */

.noteStem{
    position:absolute;

    left:27px;
    top:1px;

    width:18px;
    height:5px;

    border-radius:5px;

    background:currentColor;
}

/* =========================
   JUDGE LINE
========================= */

.judgeLine{
    position:absolute;

    left:0;
    right:0;
    bottom:32px;

    height:4px;

    z-index:40;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 25px rgba(255,255,255,.8);
}

.judgeLine::before{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:-8px;
    bottom:-8px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.06),
            transparent
        );
}

/* =========================
   JUDGE TEXT
========================= */

.judge{
    position:absolute;

    left:50%;
    top:35%;

    transform:
        translate(-50%,-50%);

    z-index:80;

    font-size:32px;
    font-weight:900;

    opacity:0;
    pointer-events:none;

    text-shadow:
        0 0 15px white;
}

.judge.show{
    animation:
        judgeAnimation .35s ease-out;
}

@keyframes judgeAnimation{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.7);
    }

    25%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1);
    }

}

/* =========================
   COUNTDOWN
========================= */

.countdown{
    position:absolute;

    left:50%;
    top:42%;

    transform:
        translate(-50%,-50%);

    z-index:100;

    font-size:78px;
    font-weight:900;

    text-shadow:
        0 0 25px white;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:130px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    z-index:100;

    background:#08080d;
}

.control{
    border:0;
    border-top:3px solid;

    background:#101018;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    transition:
        transform .06s,
        background .06s;
}

.control small{
    color:#777;
    font-size:10px;
}

.control strong{
    font-size:30px;
}

.control.red{
    border-color:#ff3d48;
}

.control.yellow{
    border-color:#ffe329;
}

.control.blue{
    border-color:#3d8cff;
}

.control.red.active{
    background:rgba(255,61,72,.28);
}

.control.yellow.active{
    background:rgba(255,227,41,.25);
}

.control.blue.active{
    background:rgba(61,140,255,.28);
}

.control.active{
    transform:scale(.96);
}

/* =========================
   START
========================= */

.startOverlay{
    position:absolute;
    inset:0;

    z-index:150;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:rgba(4,4,8,.96);
}

.startOverlay h2{
    margin:0;
    font-size:46px;
}

.startOverlay p{
    color:#777;
}

.startButton{
    margin-top:24px;

    padding:15px 60px;

    border:0;
    border-radius:12px;

    background:white;
    color:#111;

    font-weight:bold;
}

/* =========================
   RESULT
========================= */

#resultScreen{
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 30%,
            #303040,
            #08080d 70%
        );
}

.result{
    width:min(90%,520px);
    text-align:center;
}

.result small{
    color:#777;
    letter-spacing:4px;
}

.result h1{
    margin:8px 0;
    font-size:70px;
}

.resultSong{
    color:#888;
}

.finalScore{
    margin-top:30px;
    font-size:68px;
    font-weight:900;
}

.resultStats{
    margin-top:25px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:10px;
}

.resultStat{
    padding:17px;

    border-radius:12px;

    background:#15151d;
}

.resultStat small{
    display:block;
    letter-spacing:0;
}

.resultStat strong{
    display:block;
    margin-top:6px;
    font-size:22px;
}

.reward{
    margin-top:20px;
    padding:18px;

    border-radius:14px;

    background:#15151d;
    border:1px solid #30303a;
}

.rewardIcon{
    font-size:35px;
}

.rewardTitle{
    display:block;
    margin-top:6px;
    font-size:19px;
}

.rewardMessage{
    margin-bottom:0;
    color:#888;
}

.resultButtons{
    margin-top:18px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;
}

.resultButtons button{
    padding:15px;

    border:0;
    border-radius:10px;

    background:#24242d;
    color:white;
}

.resultButtons button:first-child{
    background:white;
    color:#111;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .logo h1{
        font-size:44px;
    }

    .header{
        height:58px;
    }

    .playArea{
        top:58px;
        bottom:115px;
    }

    .controls{
        height:115px;
    }

    .note{
        transform:translateX(-50%) scale(.9);
    }

    .finalScore{
        font-size:58px;
    }

}
</style>
</head>

<body>


<!-- ==================================================
     MENU
================================================== -->

<section
    id="menuScreen"
    class="screen active"
>

    <div class="menu">

        <div class="logo">

            <small>RHYTHM GAME</small>

            <h1>COLOR BEAT</h1>

            <p>
                음악의 박자에 맞춰 음표를 입력하세요
            </p>

        </div>


        <div class="songList">

            <button
                class="songButton"
                data-song="lemonade"
            >

                <small>SONG 01</small>

                <strong>
                    LEMONADE
                </strong>

                <span>
                    aespa
                </span>

            </button>


            <button
                class="songButton"
                data-song="loveAttack"
            >

                <small>SONG 02</small>

                <strong>
                    LOVE ATTACK
                </strong>

                <span>
                    RESCENE
                </span>

            </button>


            <button
                class="songButton"
                data-song="blueValentine"
            >

                <small>SONG 03</small>

                <strong>
                    BLUE VALENTINE
                </strong>

                <span>
                    NMIXX
                </span>

            </button>

        </div>


        <div class="help">
            A = RED &nbsp; S = YELLOW &nbsp; D = BLUE
        </div>

    </div>

</section>


<!-- ==================================================
     GAME
================================================== -->

<section
    id="gameScreen"
    class="screen"
>

    <div class="game">

        <div class="header">

            <button
                class="backButton"
                id="backButton"
            >
                ←
            </button>


            <div class="songInfo">

                <strong id="gameTitle">
                    LEMONADE
                </strong>

                <span id="gameArtist">
                    aespa
                </span>

            </div>


            <div class="scoreBox">

                <small>
                    SCORE
                </small>

                <strong id="scoreText">
                    0
                </strong>

            </div>

        </div>


        <div class="playArea">


            <!-- 피아노 타일 배경 -->

            <div class="pianoBackground">

                <div class="pianoLane red"></div>

                <div class="pianoLane yellow"></div>

                <div class="pianoLane blue"></div>

            </div>


            <!-- 음표 -->

            <div
                class="notes"
                id="notes"
            ></div>


            <!-- 판정선 -->

            <div class="judgeLine"></div>


            <!-- 판정 문자 -->

            <div
                class="judge"
                id="judge"
            ></div>


            <!-- 카운트다운 -->

            <div
                class="countdown"
                id="countdown"
            ></div>


        </div>


        <!-- 버튼 -->

        <div class="controls">

            <button
                class="control red"
                data-lane="0"
            >

                <small>RED</small>

                <strong>A</strong>

            </button>


            <button
                class="control yellow"
                data-lane="1"
            >

                <small>YELLOW</small>

                <strong>S</strong>

            </button>


            <button
                class="control blue"
                data-lane="2"
            >

                <small>BLUE</small>

                <strong>D</strong>

            </button>

        </div>


        <!-- 시작 -->

        <div
            class="startOverlay"
            id="startOverlay"
        >

            <h2 id="startTitle">
                LEMONADE
            </h2>

            <p id="startArtist">
                aespa
            </p>

            <button
                class="startButton"
                id="startButton"
            >
                START
            </button>

        </div>


        <audio
            id="music"
            preload="auto"
        ></audio>

    </div>

</section>


<!-- ==================================================
     RESULT
================================================== -->

<section
    id="resultScreen"
    class="screen"
>

    <div class="result">

        <small>
            RESULT
        </small>


        <h1 id="resultTitle">
            CLEAR
        </h1>


        <div
            class="resultSong"
            id="resultSong"
        ></div>


        <div
            class="finalScore"
            id="finalScore"
        >
            0 / 100
        </div>


        <div class="resultStats">

            <div class="resultStat">

                <small>
                    HIT
                </small>

                <strong id="resultHit">
                    0
                </strong>

            </div>


            <div class="resultStat">

                <small>
                    MISS
                </small>

                <strong id="resultMiss">
                    0
                </strong>

            </div>

        </div>


        <div class="reward">

            <div
                class="rewardIcon"
                id="rewardIcon"
            >
                🎁
            </div>


            <strong
                class="rewardTitle"
                id="rewardTitle"
            >
                CLEAR REWARD
            </strong>


            <p
                class="rewardMessage"
                id="rewardMessage"
            >
                모든 음표를 맞혔습니다!
            </p>

        </div>


        <div class="resultButtons">

            <button id="retryButton">
                다시 하기
            </button>

            <button id="menuButton">
                곡 선택
            </button>

        </div>

    </div>

</section>


<script>

/* ==================================================
   SONG DATA
================================================== */

const songs = {

    lemonade:{
        title:"LEMONADE",
        artist:"aespa",
        file:"./music/lemonade.mp3",

        bpm:129.20,
        offset:0.21,
        duration:187.09,

        difficulty:1.00
    },


    loveAttack:{
        title:"LOVE ATTACK",
        artist:"RESCENE",
        file:"./music/love_attack.mp3",

        bpm:112.35,
        offset:0.19,
        duration:181.63,

        difficulty:1.08
    },


    blueValentine:{
        title:"BLUE VALENTINE",
        artist:"NMIXX",
        file:"./music/blue_valentine.mp3",

        bpm:161.50,
        offset:0.58,
        duration:186.10,

        difficulty:1.20
    }

};


/* ==================================================
   ELEMENTS
================================================== */

const menuScreen =
    document.getElementById("menuScreen");

const gameScreen =
    document.getElementById("gameScreen");

const resultScreen =
    document.getElementById("resultScreen");

const startOverlay =
    document.getElementById("startOverlay");

const startButton =
    document.getElementById("startButton");

const backButton =
    document.getElementById("backButton");

const retryButton =
    document.getElementById("retryButton");

const menuButton =
    document.getElementById("menuButton");

const music =
    document.getElementById("music");

const notes =
    document.getElementById("notes");

const judge =
    document.getElementById("judge");

const countdown =
    document.getElementById("countdown");

const scoreText =
    document.getElementById("scoreText");


/* ==================================================
   GAME VARIABLES
================================================== */

let currentSong =
    songs.lemonade;

let running =
    false;

let animation =
    null;

let chart =
    [];

let chartIndex =
    0;

let activeNotes =
    [];

let hit =
    0;

let miss =
    0;

let totalNotes =
    0;


/*
   음표가 판정선에 들어오는 시간

   ±0.10초

   기존보다 훨씬 좁게 설정
*/

const hitWindow =
    0.10;


/*
   음표 이동 시간
*/

const travelTime =
    1.55;


/* ==================================================
   SONG SELECT
================================================== */

document
.querySelectorAll(".songButton")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const id =
                button.dataset.song;

            if(!songs[id]){
                return;
            }

            currentSong =
                songs[id];

            openGame();

        }
    );

});


/* ==================================================
   OPEN GAME
================================================== */

function openGame(){

    menuScreen.classList.remove(
        "active"
    );

    resultScreen.classList.remove(
        "active"
    );

    gameScreen.classList.add(
        "active"
    );


    document.getElementById(
        "gameTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "gameArtist"
    ).textContent =
        currentSong.artist;


    document.getElementById(
        "startTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "startArtist"
    ).textContent =
        currentSong.artist;


    resetGame();

}


/* ==================================================
   RESET
================================================== */

function resetGame(){

    running =
        false;


    if(animation){

        cancelAnimationFrame(
            animation
        );

    }


    music.pause();

    music.currentTime =
        0;

    music.src =
        currentSong.file;


    hit =
        0;

    miss =
        0;

    chartIndex =
        0;

    activeNotes =
        [];

    notes.innerHTML =
        "";


    chart =
        createChart(
            currentSong
        );


    totalNotes =
        chart.length;


    updateScore();

}


/* ==================================================
   CREATE CHART
================================================== */

function createChart(song){

    const result =
        [];

    const beat =
        60 /
        song.bpm;


    let time =
        song.offset +
        0.15;


    let previousLane =
        1;


    while(
        time <
        song.duration - 2
    ){

        const progress =
            time /
            song.duration;


        /*
           곡 진행에 따라
           노트 밀도 증가
        */

        let density;


        if(progress < 0.12){

            density =
                0.48;

        }
        else if(progress < 0.30){

            density =
                0.62;

        }
        else if(progress < 0.55){

            density =
                0.74;

        }
        else if(progress < 0.75){

            density =
                0.84;

        }
        else{

            density =
                0.94;

        }


        density *=
            song.difficulty;


        /*
           기본 색 패턴

           RED
           YELLOW
           BLUE

           또는 역순
        */

        const phase =
            Math.floor(
                time /
                beat
            );


        const pattern =
            Math.floor(
                phase / 4
            ) % 2;


        let lane;


        if(pattern === 0){

            lane =
                phase % 3;

        }
        else{

            lane =
                2 -
                phase % 3;

        }


        /*
           같은 레인이
           너무 반복되지 않게
        */

        if(
            lane === previousLane &&
            Math.random() < 0.7
        ){

            lane =
                (
                    lane +
                    1 +
                    Math.floor(
                        Math.random()*2
                    )
                ) % 3;

        }


        /*
           노트 생성
        */

        if(
            Math.random() <
            density
        ){

            result.push({

                time:
                    Number(
                        time.toFixed(3)
                    ),

                lane:
                    lane

            });


            previousLane =
                lane;


            /*
               후반부에는
               반박자 노트 추가

               너무 초반부터
               어렵게 만들지 않음
            */

            if(
                progress > 0.55 &&
                Math.random() <
                density * 0.30
            ){

                const extraTime =
                    time +
                    beat / 2;


                if(
                    extraTime <
                    song.duration - 2
                ){

                    let extraLane;


                    if(lane === 0){

                        extraLane =
                            Math.random() <
                            0.5
                            ? 1
                            : 2;

                    }
                    else if(lane === 2){

                        extraLane =
                            Math.random() <
                            0.5
                            ? 0
                            : 1;

                    }
                    else{

                        extraLane =
                            Math.random() <
                            0.5
                            ? 0
                            : 2;

                    }


                    result.push({

                        time:
                            Number(
                                extraTime.toFixed(3)
                            ),

                        lane:
                            extraLane

                    });

                }

            }

        }


        time +=
            beat;

    }


    result.sort(
        (a,b)=>
            a.time -
            b.time
    );


    return result;

}


/* ==================================================
   START
================================================== */

startButton.addEventListener(
    "click",
    startGame
);


async function startGame(){

    resetGame();


    startOverlay.style.display =
        "none";


    await countdownStart();


    try{

        music.currentTime =
            0;

        await music.play();

    }
    catch(error){

        console.error(error);

        alert(
            "음악을 재생할 수 없습니다.\n\n" +
            "GitHub의 music 폴더에서 " +
            "파일 이름을 확인해주세요."
        );


        startOverlay.style.display =
            "flex";

        return;

    }


    running =
        true;


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   COUNTDOWN
================================================== */

function countdownStart(){

    return new Promise(resolve=>{

        let number =
            3;


        function next(){

            if(number > 0){

                countdown.textContent =
                    number;

                number--;


                setTimeout(
                    next,
                    600
                );

            }
            else{

                countdown.textContent =
                    "START!";


                setTimeout(
                    ()=>{

                        countdown.textContent =
                            "";

                        resolve();

                    },
                    450
                );

            }

        }


        next();

    });

}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop(){

    if(!running){
        return;
    }


    const time =
        music.currentTime;


    spawnNotes(
        time
    );


    updateNotes(
        time
    );


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==================================================
   SPAWN NOTES
================================================== */

function spawnNotes(time){

    while(
        chartIndex <
        chart.length
    ){

        const data =
            chart[chartIndex];


        const spawnTime =
            data.time -
            travelTime;


        if(
            time <
            spawnTime
        ){

            break;

        }


        createNote(
            data
        );


        chartIndex++;

    }

}


/* ==================================================
   CREATE NOTE
================================================== */

function createNote(data){

    const note =
        document.createElement(
            "div"
        );


    const colors = [
        "red",
        "yellow",
        "blue"
    ];


    note.className =
        "note " +
        colors[data.lane];


    const stem =
        document.createElement(
            "div"
        );


    stem.className =
        "noteStem";


    note.appendChild(
        stem
    );


    const playArea =
        document.querySelector(
            ".playArea"
        );


    const laneWidth =
        playArea.clientWidth /
        3;


    const x =
        laneWidth *
        data.lane +
        laneWidth / 2;


    note.style.left =
        x + "px";


    note.style.top =
        "-70px";


    note.dataset.lane =
        data.lane;


    note.noteTime =
        data.time;


    note.hit =
        false;


    notes.appendChild(
        note
    );


    activeNotes.push(
        note
    );

}


/* ==================================================
   UPDATE NOTES
================================================== */

function updateNotes(time){

    const line =
        document.querySelector(
            ".judgeLine"
        );


    const startY =
        -70;


    const endY =
        line.offsetTop -
        25;


    for(
        let i =
            activeNotes.length - 1;

        i >= 0;

        i--
    ){

        const note =
            activeNotes[i];


        if(note.hit){
            continue;
        }


        const remaining =
            note.noteTime -
            time;


        let progress =
            1 -
            remaining /
            travelTime;


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        const y =
            startY +
            (
                endY -
                startY
            ) *
            progress;


        note.style.top =
            y + "px";


        /*
           판정선을 지나면 MISS
        */

        if(
            time -
            note.noteTime >
            hitWindow
        ){

            missNote(
                note
            );

        }

    }

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(!running){
            return;
        }


        let lane =
            -1;


        if(
            event.key === "a" ||
            event.key === "A"
        ){

            lane =
                0;

        }
        else if(
            event.key === "s" ||
            event.key === "S"
        ){

            lane =
                1;

        }
        else if(
            event.key === "d" ||
            event.key === "D"
        ){

            lane =
                2;

        }


        if(lane !== -1){

            event.preventDefault();

            visualPress(
                lane
            );

            pressLane(
                lane
            );

        }

    }
);


/* ==================================================
   BUTTON
================================================== */

document
.querySelectorAll(".control")
.forEach(button=>{

    button.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();


            if(!running){
                return;
            }


            const lane =
                Number(
                    button.dataset.lane
                );


            button.classList.add(
                "active"
            );


            setTimeout(
                ()=>{

                    button.classList.remove(
                        "active"
                    );

                },
                90
            );


            pressLane(
                lane
            );

        }
    );

});


/* ==================================================
   VISUAL PRESS
================================================== */

function visualPress(lane){

    const button =
        document.querySelector(
            `.control[data-lane="${lane}"]`
        );


    if(!button){
        return;
    }


    button.classList.add(
        "active"
    );


    setTimeout(
        ()=>{

            button.classList.remove(
                "active"
            );

        },
        90
    );

}


/* ==================================================
   PRESS LANE
================================================== */

function pressLane(lane){

    if(!running){
        return;
    }


    const now =
        music.currentTime;


    let target =
        null;


    let closest =
        Infinity;


    /*
       해당 레인의 가장 가까운
       음표를 찾는다.
    */

    for(
        const note of activeNotes
    ){

        if(note.hit){
            continue;
        }


        if(
            Number(
                note.dataset.lane
            ) !== lane
        ){

            continue;

        }


        const distance =
            Math.abs(
                note.noteTime -
                now
            );


        if(
            distance <
            closest
        ){

            closest =
                distance;

            target =
                note;

        }

    }


    /*
       정확한 음표가 없으면
       무조건 MISS

       연타 방지의 핵심
    */

    if(
        !target ||
        closest >
        hitWindow
    ){

        miss++;


        updateScore();


        showJudge(
            "MISS"
        );


        return;

    }


    /*
       HIT
    */

    hit++;


    target.hit =
        true;


    removeNote(
        target
    );


    updateScore();


    showJudge(
        "HIT"
    );

}


/* ==================================================
   MISS NOTE
================================================== */

function missNote(note){

    if(note.hit){
        return;
    }


    note.hit =
        true;


    miss++;


    removeNote(
        note
    );


    updateScore();


    showJudge(
        "MISS"
    );

}


/* ==================================================
   REMOVE NOTE
================================================== */

function removeNote(note){

    const index =
        activeNotes.indexOf(
            note
        );


    if(index !== -1){

        activeNotes.splice(
            index,
            1
        );

    }


    if(note.parentNode){

        note.parentNode.removeChild(
            note
        );

    }

}


/* ==================================================
   SCORE
================================================== */

function getScore(){

    if(totalNotes <= 0){
        return 0;
    }


    return Math.round(
        hit /
        totalNotes *
        100
    );

}


function updateScore(){

    scoreText.textContent =
        getScore();

}


/* ==================================================
   JUDGE
================================================== */

function showJudge(text){

    judge.textContent =
        text;


    judge.classList.remove(
        "show"
    );


    void judge.offsetWidth;


    judge.classList.add(
        "show"
    );

}


/* ==================================================
   MUSIC END
================================================== */

music.addEventListener(
    "ended",
    finishGame
);


function finishGame(){

    if(!running){
        return;
    }


    running =
        false;


    if(animation){

        cancelAnimationFrame(
            animation
        );

    }


    /*
       아직 남아있는 음표는
       전부 MISS
    */

    for(
        const note of [
            ...activeNotes
        ]
    ){

        if(!note.hit){

            note.hit =
                true;

            miss++;

            removeNote(
                note
            );

        }

    }


    updateScore();


    const finalScore =
        getScore();


    /*
       100점만 CLEAR
    */

    const cleared =
        finalScore === 100;


    showResult(
        cleared,
        finalScore
    );

}


/* ==================================================
   RESULT
================================================== */

function showResult(
    cleared,
    finalScore
){

    gameScreen.classList.remove(
        "active"
    );


    resultScreen.classList.add(
        "active"
    );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    resultTitle.textContent =
        cleared
        ? "CLEAR"
        : "FAILED";


    resultTitle.style.color =
        cleared
        ? "#ffffff"
        : "#ff4040";


    document.getElementById(
        "resultSong"
    ).textContent =
        currentSong.title +
        " · " +
        currentSong.artist;


    document.getElementById(
        "finalScore"
    ).textContent =
        finalScore +
        " / 100";


    document.getElementById(
        "resultHit"
    ).textContent =
        hit;


    document.getElementById(
        "resultMiss"
    ).textContent =
        miss;


    if(cleared){

        document.getElementById(
            "rewardIcon"
        ).textContent =
            "🎁";


        document.getElementById(
            "rewardTitle"
        ).textContent =
            "CLEAR REWARD";


        document.getElementById(
            "rewardMessage"
        ).textContent =
            "모든 음표를 맞혔습니다!";

    }
    else{

        document.getElementById(
            "rewardIcon"
        ).textContent =
            "❌";


        document.getElementById(
            "rewardTitle"
        ).textContent =
            "NO REWARD";


        document.getElementById(
            "rewardMessage"
        ).textContent =
            "모든 음표를 맞혀야 클리어할 수 있습니다.";

    }

}


/* ==================================================
   BACK
================================================== */

backButton.addEventListener(
    "click",
    ()=>{

        stopGame();


        gameScreen.classList.remove(
            "active"
        );


        menuScreen.classList.add(
            "active"
        );

    }
);


/* ==================================================
   RETRY
================================================== */

retryButton.addEventListener(
    "click",
    ()=>{

        resultScreen.classList.remove(
            "active"
        );


        gameScreen.classList.add(
            "active"
        );


        startOverlay.style.display =
            "flex";


        resetGame();

    }
);


/* ==================================================
   MENU
================================================== */

menuButton.addEventListener(
    "click",
    ()=>{

        stopGame();


        resultScreen.classList.remove(
            "active"
        );


        menuScreen.classList.add(
            "active"
        );

    }
);


/* ==================================================
   STOP
================================================== */

function stopGame(){

    running =
        false;


    if(animation){

        cancelAnimationFrame(
            animation
        );

    }


    music.pause();

    music.currentTime =
        0;


    notes.innerHTML =
        "";


    activeNotes =
        [];

}
